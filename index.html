<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0F17">
<title>Iron Ledger — 6-Week Strength Builder</title>
<style>

/* Iron Ledger — Liquid Glass. Dark, purple, frosted floating panels over a vivid bloom backdrop. */
:root{
  --bg:#0B0714;
  --ink:#F4F1FF; --ink-dim:#D2CAEC; --ink-faint:#A99FD0;
  --accent:#B79CFF; --accent-2:#8B6CF6; --accent-soft:rgba(183,156,255,.16); --accent-ink:#190f33; --accent-glow:rgba(139,108,246,.5);
  --steel:#7FE9EC; --good:#77E7B0; --good-soft:rgba(119,231,176,.16); --danger:#FB7185;
  --glass:rgba(255,255,255,.09); --glass-2:rgba(255,255,255,.05);
  --edge:rgba(255,255,255,.42); --edge-soft:rgba(255,255,255,.14); --stroke:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --sheen:rgba(255,255,255,.55);
  --bloom1:#7C3AED; --bloom2:#C026D3; --bloom3:#4338CA; --bloom4:#2DD4BF;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
body[data-user="shane"]{--accent:#7FE9EC;--accent-2:#38BDF8;--accent-soft:rgba(127,233,236,.15);--accent-glow:rgba(56,189,248,.45);--steel:#B79CFF;--bloom1:#0EA5E9;--bloom2:#22D3EE;--bloom3:#6366F1;--bloom4:#A78BFA}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body{position:relative;padding-bottom:150px;max-width:520px;margin:0 auto;background:var(--bg);min-height:100%;transition:background .3s}

/* Vivid backdrop the glass refracts */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.stage::before,.stage::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.85}
.stage::before{width:80vmax;height:80vmax;left:-24vmax;top:-26vmax;background:radial-gradient(circle at 30% 30%,var(--bloom2),transparent 60%),radial-gradient(circle at 70% 70%,var(--bloom1),transparent 60%)}
.stage::after{width:70vmax;height:70vmax;right:-24vmax;bottom:-26vmax;background:radial-gradient(circle at 40% 40%,var(--bloom4),transparent 60%),radial-gradient(circle at 60% 60%,var(--bloom3),transparent 62%)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.6}
.orb.a{width:46vmax;height:46vmax;left:28%;top:16%;background:radial-gradient(circle,var(--bloom1),transparent 62%)}
.orb.b{width:36vmax;height:36vmax;right:12%;top:46%;background:radial-gradient(circle,var(--bloom2),transparent 62%)}
header.hdr,.view,.chip{position:relative;z-index:1}

/* Glass helper mixed into panels */
.glassify{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--stroke),inset 0 -14px 26px -18px rgba(0,0,0,.5),0 18px 40px -22px rgba(10,0,30,.8)}

/* Header */
.hdr{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hdr .kicker{font-family:var(--disp);font-weight:700;letter-spacing:.22em;font-size:10.5px;color:var(--accent);text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.hdr .kicker::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent-glow)}
.hdr h1{font-family:var(--disp);font-weight:800;font-size:25px;letter-spacing:-.02em;line-height:1.05;margin-top:2px;color:var(--ink)}
.hdr .sub{color:var(--ink-faint);font-size:11.5px;margin-top:3px}
.userswitch{display:flex;gap:8px;padding-top:4px}
.uchip{width:42px;height:42px;border-radius:50%;background:var(--glass-2);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);color:var(--ink-dim);
  font-family:var(--disp);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;line-height:1;
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--stroke)}
.uchip small{font-size:7px;font-family:var(--body);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:2px;color:var(--ink-faint)}
.uchip.on{color:var(--accent-ink);background:linear-gradient(160deg,var(--accent),var(--accent-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px -6px var(--accent-2)}
.uchip.on small{color:var(--accent-ink);opacity:.8}

.chip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:30;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:6px 14px;border-radius:999px;color:var(--ink-dim);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--stroke);transition:opacity .3s;opacity:0;pointer-events:none;white-space:nowrap}
.chip.show{opacity:1}
.chip.ok{color:var(--good)}
.chip.warn{color:var(--danger)}

/* Week stepper */
.weeks{display:flex;gap:4px;padding:16px 16px 8px;justify-content:space-between}
.wk{flex:1;border:0;background:transparent;padding:0;cursor:pointer;font-family:var(--disp)}
.wk .n{width:40px;height:40px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--ink-dim);
  background:var(--glass-2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 var(--edge-soft),inset 0 0 0 1px var(--stroke);transition:transform .2s}
.wk small{display:block;text-align:center;font-family:var(--body);font-weight:700;font-size:8px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px}
.wk.deload .n{border:1px dashed var(--edge)}
.wk.on .n{color:var(--accent-ink);background:linear-gradient(160deg,var(--accent),var(--accent-2));transform:scale(1.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 24px -6px var(--accent-2)}
.wk.on small{color:var(--accent)}
.wk.deload.on .n{color:var(--accent-ink)}

/* Day rail */
.days{display:flex;gap:2px;padding:6px 8px 0;margin:0 4px;border-bottom:1px solid var(--stroke)}
.day{flex:1;text-align:center;padding:10px 0 12px;border:0;background:transparent;cursor:pointer;position:relative}
.day .d{font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint)}
.day .f{font-size:7.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);opacity:.7;margin-top:2px}
.day.rest .d{color:var(--ink-faint);opacity:.5}
.day.on .d{color:var(--ink)}
.day.on::after{content:'';position:absolute;left:24%;right:24%;bottom:-1px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 10px var(--accent-glow)}
.day .dot{width:4px;height:4px;border-radius:50%;background:var(--good);margin:4px auto 0;visibility:hidden}
.day.done .dot{visibility:visible}

/* Session progress */
.sess{padding:12px 16px 4px}
.sess .bar{height:6px;background:var(--glass-2);border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--stroke)}
.sess .fill{height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:999px;transition:width .45s cubic-bezier(.4,0,.2,1);width:0;box-shadow:0 0 12px -2px var(--accent-glow)}
.sess .lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px;font-weight:700}

/* Sections */
.wrap{padding:0 16px}
.card{position:relative;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);border-radius:26px;padding:16px;margin-bottom:14px;
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--stroke),inset 0 -14px 26px -18px rgba(0,0,0,.5),0 18px 40px -22px rgba(10,0,30,.8)}
.card::before{content:'';position:absolute;left:0;right:0;top:0;height:44%;background:linear-gradient(180deg,var(--sheen),transparent);opacity:.14;pointer-events:none}
.card h3{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3::before{content:'';width:14px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),transparent)}

.hero{padding:14px 4px 10px}
.hero-ey{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.hero-t{font-family:var(--disp);font-weight:800;font-size:clamp(30px,9vw,44px);line-height:.94;text-transform:uppercase;letter-spacing:-.02em;margin-top:6px;color:var(--ink);text-wrap:balance}
.hero-sub{font-size:11.5px;color:var(--ink-faint);margin-top:8px}

/* Protein pill */
.pstrip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;margin-bottom:14px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--stroke)}
.pstrip .g{font-family:var(--disp);font-weight:800;font-size:15px;white-space:nowrap;color:var(--accent)}
.pstrip .k{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.pstrip .s{display:none}

/* Checklist */
.chk{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--stroke);cursor:pointer}
.chk:first-of-type{border-top:0}
.chk-ico{width:34px;height:34px;flex:none;background:var(--glass-2);border-radius:11px;color:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--edge-soft),inset 0 0 0 1px var(--stroke)}
.chk-ico svg{width:26px;height:26px}
.chk.on .chk-ico{opacity:.4}
.chk .box{width:21px;height:21px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--accent-ink);box-shadow:inset 0 0 0 1.5px var(--edge)}
.chk.on .box{background:linear-gradient(160deg,var(--good),#3fbf88);box-shadow:none}
.chk .txt{font-size:13.5px;color:var(--ink-dim)}
.chk.on .txt{color:var(--ink-faint);text-decoration:line-through}

/* Collapsible header */
.collap-h{display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:0}
.collap-h .chev{margin-left:auto;color:var(--ink-faint);font-size:13px;transition:transform .2s}
.card.collapsed .collap-body{display:none}
.card:not(.collapsed) .collap-h{margin-bottom:10px}
.card:not(.collapsed) .collap-h .chev{transform:rotate(180deg)}
.collap-h .sub{font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--accent)}

/* Exercises */
.exlist{position:relative;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);border-radius:26px;padding:2px 16px;margin-bottom:14px;
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--stroke),0 18px 40px -22px rgba(10,0,30,.8)}
.ex{background:transparent;border:0;border-top:1px solid var(--stroke);border-radius:0;margin:0;overflow:hidden}
.exlist .ex:first-child{border-top:0}
.ex.main-lift{position:relative;margin:12px 0;padding:2px 16px;border-top:0;border-radius:20px;overflow:hidden;
  background:linear-gradient(135deg,var(--accent-soft),transparent 72%);-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--stroke)}
.ex.main-lift::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.ex-head{padding:15px 2px;cursor:pointer;display:flex;align-items:center;gap:13px}
.ex.main-lift .ex-head{padding:16px 6px}
.ex-ico{width:50px;height:50px;flex:none;border-radius:16px;color:var(--accent);display:flex;align-items:center;justify-content:center;background:var(--glass-2);box-shadow:inset 0 1px 0 var(--edge-soft),inset 0 0 0 1px var(--stroke)}
.ex.main-lift .ex-ico{width:58px;height:58px}
.ex-ico svg{width:38px;height:38px}
.ex.main-lift .ex-ico svg{width:44px;height:44px}
.ex-head .nm{font-family:var(--disp);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;color:var(--ink)}
.ex.main-lift .ex-head .nm{font-size:20px}
.ex-head .tag{font-family:var(--body);font-weight:800;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:3px}
.ex-head .rx{color:var(--ink-faint);font-size:11.5px;margin-top:3px;letter-spacing:.02em}
.ex-head .load{font-family:var(--disp);font-weight:800;font-size:24px;white-space:nowrap;text-align:right;color:var(--ink);line-height:.95}
.ex.main-lift .ex-head .load{font-size:34px;background:linear-gradient(180deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.ex-head .load small{display:block;font-family:var(--body);font-weight:700;font-size:9px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
.ex-body{border-top:1px solid var(--stroke);padding:12px 2px 14px;display:none}
.ex.main-lift .ex-body{padding:12px 6px 16px}
.ex.open .ex-body{display:block}
.note{font-size:12px;color:var(--ink-faint)}
.ex-body .note{margin-bottom:10px}
.prevline{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:11px;padding:7px 11px;margin-bottom:8px;font-weight:600}
.prevline .pl-lab{opacity:.7;font-weight:700;margin-right:6px;text-transform:uppercase;letter-spacing:.04em;font-size:10px}
.suggest{font-size:12px;color:var(--good);background:var(--good-soft);border-radius:11px;padding:7px 11px;margin-bottom:8px;font-weight:600}
.rampline{font-size:11.5px;color:var(--ink-dim);background:var(--glass-2);border-radius:11px;padding:7px 11px;margin-bottom:8px;box-shadow:inset 0 0 0 1px var(--stroke)}
.rampline b{color:var(--ink)}
.plateline{font-size:11.5px;color:var(--accent);margin-top:3px;font-weight:700}
.plateline .pl-empty{color:var(--ink-faint);font-weight:400}
.prbadge{display:inline-block;font-family:var(--disp);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);background:linear-gradient(160deg,var(--accent),var(--accent-2));border-radius:7px;padding:2px 7px;margin-left:6px;vertical-align:middle;box-shadow:0 0 14px -3px var(--accent-glow)}
.deload-badge{display:inline-block;font-family:var(--disp);font-weight:800;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);background:linear-gradient(160deg,var(--steel),#5ad0d3);border-radius:7px;padding:3px 9px}

/* Set rows */
.setrow{display:grid;grid-template-columns:32px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:8px}
.setrow .lbl{font-family:var(--disp);font-weight:700;color:var(--ink-faint);font-size:13px;text-align:center;cursor:pointer;border-radius:6px}
.setrow input{width:100%;background:var(--glass-2);border:0;border-radius:12px;color:var(--ink);font-family:var(--body);font-weight:600;font-size:16px;padding:10px 6px;text-align:center;
  box-shadow:inset 0 1px 0 var(--edge-soft),inset 0 0 0 1px var(--stroke);transition:box-shadow .15s}
.setrow input::placeholder{color:var(--ink-faint);font-weight:400}
.setrow .ok{height:44px;border-radius:13px;border:0;background:var(--glass-2);color:var(--ink-faint);font-size:16px;cursor:pointer;box-shadow:inset 0 1px 0 var(--edge-soft),inset 0 0 0 1px var(--stroke)}
.setrow.done input{opacity:.5}
.setrow.done .ok{background:linear-gradient(160deg,var(--good),#3fbf88);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.setrow.miss input{opacity:.4;text-decoration:line-through}
.setrow.miss .ok{box-shadow:inset 0 0 0 1.5px var(--danger)}
.setdetail{grid-column:1 / -1;background:var(--glass-2);border-radius:12px;padding:9px 11px;margin:-2px 0 8px;display:none;box-shadow:inset 0 0 0 1px var(--stroke)}
.setdetail.on{display:block}
.rpe-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.rpe-chip{flex:1;min-width:34px;padding:7px 0;text-align:center;border-radius:9px;background:var(--glass-2);color:var(--ink-dim);font-weight:700;font-size:13px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--stroke)}
.rpe-chip.on{background:linear-gradient(160deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:none}
.setdetail .miss-btn{width:100%;padding:9px;border:0;border-radius:9px;background:var(--glass-2);color:var(--ink-dim);font-weight:700;font-size:12px;cursor:pointer;margin-bottom:7px;box-shadow:inset 0 0 0 1px var(--stroke)}
.setdetail .miss-btn.on{background:var(--danger);color:#fff;box-shadow:none}
.setdetail input{width:100%;background:var(--glass-2);border:0;border-radius:9px;color:var(--ink);font-size:14px;padding:9px 11px;box-shadow:inset 0 0 0 1px var(--stroke)}
.setrow input:focus,.wlog input:focus,.maxrow input:focus,.syncrow input:focus,.edfield input:focus,.setdetail input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}

/* Editor */
.edrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--stroke)}
.edrow:first-child{border-top:0}
.edrow .en{flex:1;font-size:13.5px;color:var(--ink)}
.edrow .en.locked{color:var(--ink-dim)}
.edrow .em{font-size:11px;color:var(--ink-faint)}
.edbtn{width:34px;height:34px;flex:none;border:0;border-radius:11px;background:var(--glass-2);color:var(--ink-dim);font-size:15px;cursor:pointer;box-shadow:inset 0 1px 0 var(--edge-soft),inset 0 0 0 1px var(--stroke)}
.edbtn.danger{color:var(--danger)}
.edfield{display:grid;grid-template-columns:1fr 60px 70px 56px;gap:6px;margin:8px 0}
.edfield input{background:var(--glass-2);border:0;border-radius:10px;color:var(--ink);font-size:14px;padding:9px;text-align:center;box-shadow:inset 0 0 0 1px var(--stroke)}
.edfield input.nm{text-align:left}

/* Progress */
.seg{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;white-space:nowrap;padding:9px 10px;border:0;border-radius:13px;background:var(--glass-2);color:var(--ink-dim);font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 1px 0 var(--edge-soft),inset 0 0 0 1px var(--stroke)}
.seg button.on{background:linear-gradient(160deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.statgrid{display:flex;justify-content:space-around;text-align:center;margin:4px 0 6px}
.statgrid .v{font-family:var(--disp);font-weight:800;font-size:22px;color:var(--steel)}
.statgrid .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
.histentry{padding:11px 2px;border-top:1px solid var(--stroke)}
.histentry:first-child{border-top:0}
.histentry .ht{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;color:var(--ink)}
.histentry .hs{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.prrow{display:flex;justify-content:space-between;padding:8px 2px;border-top:1px solid var(--stroke);font-size:13px;color:var(--ink-dim)}
.prrow:first-child{border-top:0}
.prrow b{color:var(--accent)}

/* Buttons */
.ex-actions{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:12px;border-radius:14px;border:0;background:var(--glass-2);color:var(--ink-dim);font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 1px 0 var(--edge-soft),inset 0 0 0 1px var(--stroke)}
.btn.primary{background:linear-gradient(160deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px -8px var(--accent-glow)}

/* Rest day */
.restcard{text-align:center;padding:28px 18px}
.restcard .big{font-family:var(--disp);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
.restcard p{color:var(--ink-dim);font-size:13.5px;margin-top:8px}
.restcard ul{list-style:none;margin-top:14px;text-align:left}
.restcard li{padding:8px 0;border-top:1px solid var(--stroke);color:var(--ink-dim);font-size:13.5px}
.restcard li:first-child{border-top:0}

/* Bottom nav — floating glass pill */
.nav{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:492px;margin:0 auto;display:flex;padding:7px;gap:4px;border-radius:26px;z-index:20;
  background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--stroke),0 22px 50px -18px rgba(10,0,30,.9)}
.nav button{flex:1;padding:9px 0;border:0;border-radius:19px;background:transparent;color:var(--ink-faint);cursor:pointer;
  font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--accent-ink);background:linear-gradient(160deg,var(--accent),var(--accent-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px -6px var(--accent-2)}

/* Rest timer — floating glass */
.timer{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);max-width:492px;margin:0 auto;border-radius:22px;overflow:hidden;display:none;z-index:19;
  background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--stroke),0 20px 44px -20px rgba(10,0,30,.85)}
.timer.on{display:block}
.timer .tfill{position:absolute;inset:0;background:var(--accent-soft);transform-origin:left;transition:transform .25s linear}
.timer .trow{position:relative;display:flex;align-items:center;justify-content:space-between;padding:11px 16px}
.timer .lbl{font-family:var(--disp);font-weight:700;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.timer .t{font-family:var(--disp);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.timer button{border:0;border-radius:13px;padding:9px 15px;font-family:var(--disp);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--ink);background:var(--glass-2);box-shadow:inset 0 1px 0 var(--edge-soft),inset 0 0 0 1px var(--stroke)}
.timer .done-btn{color:var(--accent-ink);background:linear-gradient(160deg,var(--accent),var(--accent-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.timer.alarm{animation:flash .5s 3}
.timer.ringing{animation:flash .5s infinite}
.timer.ringing .done-btn{animation:pulse .7s infinite;font-size:14px;padding:9px 20px}
@keyframes flash{50%{background:var(--danger)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* Weight view */
.big-num{font-family:var(--disp);font-weight:800;font-size:52px;line-height:1;text-align:center;background:linear-gradient(180deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.big-num small{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px}
.goalrow{display:flex;justify-content:space-around;margin-top:16px;text-align:center}
.goalrow .v{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--steel)}
.goalrow .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
.wlog{display:flex;gap:8px;margin-top:14px}
.wlog input{flex:1;background:var(--glass-2);border:0;border-radius:13px;color:var(--ink);font-weight:600;font-size:16px;padding:12px;text-align:center;box-shadow:inset 0 1px 0 var(--edge-soft),inset 0 0 0 1px var(--stroke)}
.wentry{display:flex;justify-content:space-between;padding:9px 2px;border-top:1px solid var(--stroke);font-size:13.5px;color:var(--ink-dim)}
.wentry:first-child{border-top:0}
.wentry b{color:var(--ink)}
svg text{font-family:var(--body)}

/* Setup */
.maxrow{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;margin-bottom:10px}
.maxrow label{font-size:13.5px;color:var(--ink-dim)}
.maxrow input{background:var(--glass-2);border:0;border-radius:12px;color:var(--ink);font-weight:600;font-size:16px;padding:10px;text-align:center;box-shadow:inset 0 1px 0 var(--edge-soft),inset 0 0 0 1px var(--stroke)}
.syncrow{display:flex;gap:8px;margin-bottom:8px}
.syncrow input{flex:1;background:var(--glass-2);border:0;border-radius:12px;color:var(--ink);font-size:16px;padding:11px 12px;box-shadow:inset 0 1px 0 var(--edge-soft),inset 0 0 0 1px var(--stroke)}
.syncstat{font-size:12px;margin-top:6px;color:var(--ink-faint)}
.syncstat.ok{color:var(--good)}
.syncstat.bad{color:var(--danger)}
.bk{width:100%;min-height:72px;background:var(--glass-2);border:0;border-radius:12px;color:var(--ink);font-size:12px;font-family:ui-monospace,Menlo,monospace;padding:11px;margin-bottom:8px;word-break:break-all;box-shadow:inset 0 0 0 1px var(--stroke)}
.view{display:none}.view.on{display:block}
.hint{font-size:12px;color:var(--ink-faint);padding:0 2px 14px}

</style>
</head>

const KEY='iron-ledger-v1';
const USERS=['garney','shane'];
function blankUser(start){return {logs:{},checks:{},weights:[],maxes:{},goal:210,start:start||null,cycle:1,prev:null,program:null,bar:DEFAULT_BAR,plates:DEFAULT_PLATES.slice(),updatedAt:0};}

function stor(){try{return(window.storage&&typeof window.storage.set==='function')?window.storage:null;}catch(e){return null;}}

let saveMode=null;
async function load(){

let chipT=null;
function setChip(m){

async function writeLocal(payload){

const DEFAULT_SYNC_URL='https://iron-ledger-f988e-default-rtdb.firebaseio.com'; /* baked in — every copy connects automatically */
function cloudPath(user){return state.syncUrl.replace(/\/+$/,'')+'/iron-ledger/users/'+user+'.json';}
function mergeRows(a,b){
  const len=Math.max(a?a.length:0,b?b.length:0);const out=[];
  for(let i=0;i<len;i++){
    const x=a&&a[i],y=b&&b[i];
    if(!x){out[i]=y;continue;} if(!y){out[i]=x;continue;}
    const score=r=>((r&&r.done)?2:0)+((r&&r.w!=null)?1:0)+((r&&r.r!=null)?1:0);
    out[i]=score(y)>score(x)?y:x;
  }
  return out;
}
function mergeUser(l,r){
  if(!r)return l||blankUser(null);
  if(!l)return Object.assign(blankUser(null),r);
  const m=blankUser(null);
  const newer=(r.updatedAt||0)>(l.updatedAt||0)?r:l;
  m.updatedAt=Math.max(l.updatedAt||0,r.updatedAt||0);
  m.start=newer.start!=null?newer.start:(l.start!=null?l.start:r.start);
  m.goal=newer.goal!=null?newer.goal:(l.goal!=null?l.goal:r.goal);
  m.program=newer.program!==undefined?newer.program:(l.program||r.program||null);
  m.bar=newer.bar!=null?newer.bar:(l.bar!=null?l.bar:(r.bar!=null?r.bar:DEFAULT_BAR));
  m.plates=(newer.plates&&newer.plates.length)?newer.plates:((l.plates&&l.plates.length)?l.plates:(r.plates||DEFAULT_PLATES.slice()));
  const mk={};
  new Set([...Object.keys(l.maxes||{}),...Object.keys(r.maxes||{})]).forEach(k=>{
    const nv=newer.maxes&&newer.maxes[k];
    mk[k]=nv!=null?nv:((l.maxes&&l.maxes[k]!=null)?l.maxes[k]:(r.maxes?r.maxes[k]:null));
  });
  m.maxes=mk;
  const wm={};(r.weights||[]).forEach(w=>{wm[w.d]=w;});
  (l.weights||[]).forEach(w=>{if(!wm[w.d]||newer===l)wm[w.d]=w;});
  m.weights=Object.values(wm).sort((a,b)=>a.d.localeCompare(b.d));
  const lc=l.cycle||1,rc=r.cycle||1;
  if(lc!==rc){
    const hi=lc>rc?l:r;
    m.cycle=hi.cycle;m.prev=hi.prev||null;
    m.logs=Object.assign({},hi.logs);m.checks=Object.assign({},hi.checks);
  }else{
    m.cycle=lc;m.prev=newer.prev||l.prev||r.prev||null;
    const lg={};
    new Set([...Object.keys(l.logs||{}),...Object.keys(r.logs||{})]).forEach(k=>{lg[k]=mergeRows(l.logs&&l.logs[k],r.logs&&r.logs[k]);});
    m.logs=lg;
    const ck={};
    new Set([...Object.keys(l.checks||{}),...Object.keys(r.checks||{})]).forEach(k=>{ck[k]=!!((l.checks&&l.checks[k])||(r.checks&&r.checks[k]));});
    m.checks=ck;
  }
  return m;
}
async function cloudPush(){

async function cloudPull(user){

}

/* ================= HELPERS ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function roundLoad(x){return Math.round(x/5)*5;}
function targetLoad(lift,pct){const m=U().maxes[lift];return m?roundLoad(m*pct/100):null;}
function logKey(exId){return 'w'+state.week+'-'+state.day+'-'+exId;}
function dayDone(week,dayId){
  const day=dayMeta(dayId);if(!day||day.rest)return false;
  const list=(U().program&&U().program[dayId])||day.ex;
  return list.every(ex=>{
    const n=ex.wave?ex.wave[week-1].sets:ex.s;
    const rows=U().logs['w'+week+'-'+dayId+'-'+ex.id]||[];
    let c=0;rows.forEach(r=>{if(r&&r.done)c++;});return c>=n;
  });
}
function currentBW(){
  const ws=[...U().weights].sort((a,b)=>a.d.localeCompare(b.d));
  return ws.length?ws[ws.length-1].lbs:U().start;
}
function proteinTarget(){const bw=currentBW();return bw?Math.round(bw):null;}
function proteinStrip(){
  const p=proteinTarget();
  const val=p?('~'+p+' g'):'set weight';
  return `<div class="pstrip" title="Daily protein target: 1 g per lb of bodyweight"><span class="k">Protein</span><span class="g">${val}</span></div>`;
}
function displayName(u){return u.charAt(0).toUpperCase()+u.slice(1);}
function firstInt(txt){const m=String(txt).match(/\d+/);return m?parseInt(m[0],10):null;}
function est1RM(w,r){return (w&&r)?w*(1+r/30):0;} // Epley
/* Plate breakdown per side */
function platesFor(total){
  const u=U();const bar=u.bar||DEFAULT_BAR;const inv=(u.plates&&u.plates.length?u.plates:DEFAULT_PLATES).slice().sort((a,b)=>b-a);
  let per=(total-bar)/2;const out=[];
  if(per<=0)return {list:[],leftover:0,bar};
  inv.forEach(p=>{while(per>=p-0.001){out.push(p);per-=p;}});
  return {list:out,leftover:Math.round(per*10)/10,bar};
}
function plateStr(total){
  if(!total)return '';
  const pb=platesFor(total);
  if(!pb.list.length)return `<div class="plateline"><span class="pl-empty">bar only (${pb.bar})</span></div>`;
  const counts={};pb.list.forEach(p=>{counts[p]=(counts[p]||0)+1;});
  const parts=Object.keys(counts).sort((a,b)=>b-a).map(p=>counts[p]>1?`${counts[p]}×${p}`:`${p}`);
  return `<div class="plateline">Plates/side: ${parts.join(' + ')}${pb.leftover?` <span class="pl-empty">(+${pb.leftover} short)</span>`:''}</div>`;
}
/* Reference: previous week this cycle for same day+exercise, else same week last cycle */
function refSets(exId){
  const u=U();
  for(let w=state.week-1;w>=1;w--){
    const rows=u.logs['w'+w+'-'+state.day+'-'+exId];
    if(rows&&rows.some(r=>r&&r.w!=null))return {rows,label:'Week '+w};
  }
  if(u.prev&&u.prev.logs){
    const rows=u.prev.logs['w'+state.week+'-'+state.day+'-'+exId];
    if(rows&&rows.some(r=>r&&r.w!=null))return {rows,label:'Cycle '+(u.prev.cycle||'?')+' · Wk '+state.week};
  }
  return null;
}
/* Best prior est-1RM for a day+exercise slot, excluding a given key */
function exBest(dayId,exId,excludeKey){
  let best=0;const u=U();
  const scan=logs=>{if(!logs)return;Object.keys(logs).forEach(k=>{if(k===excludeKey)return;const m=k.match(/^w\d+-([a-z]+)-(.+)$/);if(!m||m[1]!==dayId||m[2]!==exId)return;(logs[k]||[]).forEach(r=>{if(r&&r.done&&r.w&&r.r){const e=est1RM(r.w,r.r);if(e>best)best=e;}});});};
  scan(u.logs);if(u.prev)scan(u.prev.logs);
  return best;
}
/* Is any done set in this key a PR vs all prior? */
function keyHasPR(dayId,exId,key){
  const rows=U().logs[key]||[];const prior=exBest(dayId,exId,key);
  return rows.some(r=>r&&r.done&&r.w&&r.r&&est1RM(r.w,r.r)>prior+0.01);
}
/* Warm-up ramp to a working weight (main lifts) */
function rampSets(working){
  if(!working)return null;
  const u=U();const bar=u.bar||DEFAULT_BAR;
  const pcts=[0,0.4,0.6,0.8];const reps=[5,5,3,2];const seen=new Set();const out=[];
  pcts.forEach((p,i)=>{
    let w=p===0?bar:roundLoad(working*p);
    if(w<bar)w=bar;
    if(w>=working)return;
    if(seen.has(w))return;seen.add(w);
    out.push(w+'×'+reps[i]);
  });
  return out.length?out:null;
}
/* Progression nudge: did the reference session hit all target reps? */
function progressNudge(ex,scheme,exId){
  const ref=refSets(exId);if(!ref)return '';
  const targetReps=scheme?firstInt(scheme.reps):firstInt(ex.r);
  if(!targetReps)return '';
  const done=ref.rows.filter(r=>r&&r.w!=null&&r.r!=null);
  if(!done.length)return '';
  const allHit=done.every(r=>r.r>=targetReps);
  if(!allHit)return '';
  const topW=Math.max(...done.map(r=>r.w));
  if(scheme)return `<div class="suggest">↑ Hit all reps last time — targets already scale with your 1RM, so chase the number above.</div>`;
  return `<div class="suggest">↑ You hit all ${targetReps}+ reps last time at ${topW} lb — try ${topW+5} lb this session.</div>`;
}

/* ================= TIMER + ALARM ================= */
let timerEnd=null,timerInt=null,timerTotal=0,audioCtx=null,ringInt=null,ringing=false;
function armAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
function beep(){
  try{
    if(!audioCtx)return;
    if(audioCtx.state==='suspended')audioCtx.resume();
    const t=audioCtx.currentTime;
    // two-tone alarm chirp, like a phone alarm
    [0,0.20,0.40,0.60].forEach((off,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='square';o.frequency.value=(i%2===0)?988:784;
      o.connect(g);g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001,t+off);
      g.gain.exponentialRampToValueAtTime(0.4,t+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+off+0.16);
      o.start(t+off);o.stop(t+off+0.18);
    });
  }catch(e){}
}
function buzz(){try{navigator.vibrate&&navigator.vibrate([500,180,500,180,500]);}catch(e){}}
function startRing(){
  if(ringing)return;
  ringing=true;
  const bar=document.getElementById('timerBar');
  bar.classList.add('alarm','ringing');
  const lab=document.getElementById('timerLab');if(lab)lab.textContent="Time's up";
  document.getElementById('timerT').textContent='0:00';
  document.getElementById('tfill').style.transform='scaleX(0)';
  beep();buzz();
  clearInterval(ringInt);
  ringInt=setInterval(()=>{beep();buzz();},1400); // keep ringing until Done
}
function startTimer(sec){
  armAudio(); // must happen inside the user's tap for phone audio to be allowed
  clearInterval(ringInt);ringing=false;
  timerTotal=sec;timerEnd=Date.now()+sec*1000;
  const bar=document.getElementById('timerBar');
  bar.classList.remove('alarm','ringing');bar.classList.add('on');
  const lab=document.getElementById('timerLab');if(lab)lab.textContent='Rest';
  clearInterval(timerInt);timerInt=setInterval(tick,250);tick();
}
function addTime(s){
  // during a ring, +30s silences the alarm and resumes the countdown
  if(ringing){
    clearInterval(ringInt);ringing=false;
    const bar=document.getElementById('timerBar');bar.classList.remove('alarm','ringing');
    const lab=document.getElementById('timerLab');if(lab)lab.textContent='Rest';
    timerTotal=s;timerEnd=Date.now()+s*1000;
    clearInterval(timerInt);timerInt=setInterval(tick,250);tick();
    return;
  }
  if(timerEnd){timerEnd+=s*1000;timerTotal+=s;}
}
function stopTimer(){
  clearInterval(timerInt);clearInterval(ringInt);
  timerEnd=null;ringing=false;
  try{navigator.vibrate&&navigator.vibrate(0);}catch(e){}
  const bar=document.getElementById('timerBar');bar.classList.remove('on','alarm','ringing');
}
function tick(){
  if(ringing)return;
  const left=Math.max(0,Math.round((timerEnd-Date.now())/1000));
  document.getElementById('timerT').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  const frac=timerTotal?Math.max(0,Math.min(1,left/timerTotal)):0;
  document.getElementById('tfill').style.transform='scaleX('+frac+')';
  if(left<=0){
    clearInterval(timerInt);timerEnd=null;
    startRing(); // rings continuously until the user taps Done
  }
}

function renderWeight(){
  const el=document.getElementById('weightContent');
  const u=U();
  const ws=[...u.weights].sort((a,b)=>a.d.localeCompare(b.d));
  const cur=ws.length?ws[ws.length-1].lbs:u.start;
  let chart='';
  if(ws.length>=2&&u.goal){
    const W=440,H=140,P=14;
    const base=u.start||ws[0].lbs;
    const min=Math.min(base,...ws.map(w=>w.lbs))-2;
    const max=Math.max(u.goal,...ws.map(w=>w.lbs))+2;
    const x=i=>P+(W-2*P)*i/(ws.length-1);
    const y=v=>H-P-(H-2*P)*(v-min)/(max-min);
    const pts=ws.map((w,i)=>x(i)+','+y(w.lbs)).join(' ');
    chart=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:14px">
      <line x1="${P}" y1="${y(u.goal)}" x2="${W-P}" y2="${y(u.goal)}" stroke="var(--accent)" stroke-dasharray="4 4" stroke-width="1"/>
      <text x="${W-P}" y="${y(u.goal)-4}" fill="var(--accent)" font-size="10" text-anchor="end">goal ${u.goal}</text>
      <polyline points="${pts}" fill="none" stroke="var(--steel)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${ws.map((w,i)=>`<circle cx="${x(i)}" cy="${y(w.lbs)}" r="3.5" fill="var(--steel)"/>`).join('')}
    </svg>`;
  }
  const gained=(cur&&u.start)?(cur-u.start).toFixed(1):null;
  const toGo=(cur&&u.goal)?(u.goal-cur).toFixed(1):null;
  el.innerHTML=`
    <div class="card">
      <div class="big-num">${cur??'—'}<small>${displayName(state.activeUser)} · current lb</small></div>
      <div class="goalrow">
        <div><div class="v">${u.start??'—'}</div><div class="k">start</div></div>
        <div><div class="v" style="color:${gained===null?'var(--ink-faint)':(gained>=0?'var(--good)':'var(--danger)')}">${gained===null?'—':(gained>0?'+':'')+gained}</div><div class="k">gained</div></div>
        <div><div class="v">${toGo??'—'}</div><div class="k">to ${u.goal??'goal'}</div></div>
      </div>
      ${chart}
      <div class="wlog">
        <input type="number" inputmode="decimal" step="0.1" id="wIn" placeholder="Today's weight">
        <button class="btn primary" style="flex:0 0 84px" onclick="logWeight()">Log</button>
      </div>
      <div class="note" style="margin-top:10px">Weigh in 2–3×/week, same time of day. Aim for +0.75–1.5 lb/week; if the line stalls two weeks, add ~150 calories/day.${proteinTarget()?(' Protein: ~'+proteinTarget()+' g/day at current weight.'):''}</div>
    </div>
    <div class="card"><h3>Log</h3>${ws.length?[...ws].reverse().map(w=>
      `<div class="wentry"><span>${w.d}</span><span><b>${w.lbs} lb</b> <span style="color:var(--danger);cursor:pointer;margin-left:8px" onclick="delWeight('${w.d}',${w.lbs})">✕</span></span></div>`).join('')
      :'<div class="note">No entries yet. Log your first weigh-in above.</div>'}</div>`;
}
function logWeight(){
  const v=Number(document.getElementById('wIn').value);

async function connectSync(){
  const inp=document.getElementById('syncIn');
  const stat=document.getElementById('syncStat');
  let url=(inp.value||'').trim().replace(/\/+$/,'');
  if(!/^https:\/\//.test(url)){stat.textContent='URL must start with https://';stat.className='syncstat bad';return;}
  stat.textContent='Testing connection…';stat.className='syncstat';
  const prevUrl=state.syncUrl;
  state.syncUrl=url;
  const ok=await cloudPull(state.activeUser);
  if(!ok){
    state.syncUrl=(prevUrl&&prevUrl!==url)?prevUrl:'';
    stat.textContent='Couldn\u2019t reach that URL — check it and that database rules allow read/write.';
    stat.className='syncstat bad';
    return;
  }
  await cloudPush();
  save();renderNav();renderDay();renderSetup();
  const s2=document.getElementById('syncStat');
  s2.textContent='Connected ✓ — cloud and device data merged; syncing on every save.';
  s2.className='syncstat ok';
}
async function syncNow(){
  const stat=document.getElementById('syncStat');
  stat.textContent='Syncing…';stat.className='syncstat';
  const ok=await cloudPull(state.activeUser);
  await cloudPush();
  renderNav();renderDay();
  stat.textContent=ok?'Synced ✓':'Sync failed — check connection.';
  stat.className='syncstat '+(ok?'ok':'bad');
}

function exportData(){

  const ta=document.getElementById('bkArea');ta.value=code;
  const msg=document.getElementById('bkMsg');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(
      ()=>{msg.textContent='Copied to clipboard ✓';},
      ()=>{ta.focus();ta.select();msg.textContent='Code shown above — long-press to copy.';});
  }else{ta.focus();ta.select();msg.textContent='Code shown above — long-press to copy.';}
}
function importData(){
  const msg=document.getElementById('bkMsg');
  const v=document.getElementById('bkArea').value.trim();
  if(!v){msg.textContent='Paste a backup code first.';return;}
  try{
    const s=JSON.parse(decodeURIComponent(escape(atob(v))));
    if(!s||typeof s!=='object')throw new Error('bad');
    const syncUrl=state.syncUrl;
    state=migrate(s);
    if(syncUrl&&!state.syncUrl)state.syncUrl=syncUrl;
    U().updatedAt=Date.now();
    save();renderUsers();renderNav();renderSetup();
    msg.textContent='Restored ✓ — data loaded'+(state.syncUrl?' and syncing to cloud.':'.');
  }catch(e){msg.textContent='That code didn\u2019t parse — make sure you pasted the whole thing.';}
}

  });
  if(v==='weight')renderWeight();
  if(v==='progress')renderProgress();
  if(v==='setup')renderSetup();
}
/* ================= PROGRESS ================= */
let progTab='trends';
function setProgTab(t){progTab=t;renderProgress();}
function allSessions(){
  // returns [{cycle,week,day,dayId,exCount,setsDone,volume,date}] for completed-ish days, newest first
  const u=U();const out=[];
  const scan=(logs,cyc)=>{
    if(!logs)return;
    const byDay={};
    Object.keys(logs).forEach(k=>{
      const m=k.match(/^w(\d+)-([a-z]+)-(.+)$/);if(!m)return;
      const wk=+m[1],dayId=m[2];
      const rows=logs[k]||[];let done=0,vol=0;
      rows.forEach(r=>{if(r&&r.done){done++;if(r.w&&r.r)vol+=r.w*r.r;}});
      if(!done)return;
      const kk=cyc+'-'+wk+'-'+dayId;
      if(!byDay[kk])byDay[kk]={cycle:cyc,week:wk,dayId,setsDone:0,volume:0};
      byDay[kk].setsDone+=done;byDay[kk].volume+=vol;
    });
    Object.values(byDay).forEach(s=>out.push(s));
  };
  scan(u.logs,u.cycle||1);
  if(u.prev)scan(u.prev.logs,u.prev.cycle||1);
  out.sort((a,b)=>(b.cycle-a.cycle)||(b.week-a.week)||(a.dayId<b.dayId?1:-1));
  return out;
}
const DAY_FOR_LIFT={squat:'sun',bench:'mon',row:'tue',dead:'thu',ohp:'fri'};
function mainTrend(liftKey){
  const u=U();const dayId=DAY_FOR_LIFT[liftKey];const pts=[];
  for(let w=1;w<=6;w++){
    const rows=u.logs['w'+w+'-'+dayId+'-0']||[];
    let best=0;rows.forEach(r=>{if(r&&r.done&&r.w&&r.r)best=Math.max(best,est1RM(r.w,r.r));});
    if(best)pts.push({w,v:Math.round(best)});
  }
  return pts;
}
function renderProgress(){
  const el=document.getElementById('progressContent');
  const tabs=`<div class="seg">
    <button class="${progTab==='trends'?'on':''}" onclick="setProgTab('trends')">Trends</button>
    <button class="${progTab==='volume'?'on':''}" onclick="setProgTab('volume')">Volume</button>
    <button class="${progTab==='prs'?'on':''}" onclick="setProgTab('prs')">PRs</button>
    <button class="${progTab==='history'?'on':''}" onclick="setProgTab('history')">History</button></div>`;
  let body='';
  if(progTab==='trends')body=progTrends();
  else if(progTab==='volume')body=progVolume();
  else if(progTab==='prs')body=progPRs();
  else body=progHistory();
  el.innerHTML=tabs+body;
}
function lineChart(pts,unit){
  if(pts.length<2)return `<div class="note">Log at least two weeks to see a trend.</div>`;
  const W=440,H=120,P=16;
  const vals=pts.map(p=>p.v);const min=Math.min(...vals)-5,max=Math.max(...vals)+5;
  const x=i=>P+(W-2*P)*i/(pts.length-1);
  const y=v=>H-P-(H-2*P)*(v-min)/(max-min||1);
  const line=pts.map((p,i)=>x(i)+','+y(p.v)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="var(--accent)"/><text x="${x(i)}" y="${H-3}" fill="var(--ink-faint)" font-size="9" text-anchor="middle">W${p.w}</text>`).join('')}
    <text x="${x(pts.length-1)}" y="${y(pts[pts.length-1].v)-6}" fill="var(--accent)" font-size="10" text-anchor="end">${pts[pts.length-1].v}${unit||''}</text>
  </svg>`;
}
function progTrends(){
  let out='';
  Object.keys(LIFT_NAMES).forEach(k=>{
    const pts=mainTrend(k);
    const cur=pts.length?pts[pts.length-1].v:null;
    const first=pts.length?pts[0].v:null;
    const delta=(cur&&first)?cur-first:null;
    out+=`<div class="card"><h3>${LIFT_NAMES[k]} — Est. 1RM</h3>
      ${lineChart(pts,'')}
      ${pts.length>=2?`<div class="note" style="margin-top:8px">${delta>=0?'+':''}${delta} lb across the cycle (estimated from your top sets).</div>`:''}</div>`;
  });
  return out||`<div class="card"><div class="note">No logged sets yet this cycle.</div></div>`;
}
function progVolume(){
  const u=U();const rows=[];
  for(let w=1;w<=6;w++){
    let vol=0;Object.keys(u.logs).forEach(k=>{if(k.indexOf('w'+w+'-')===0)(u.logs[k]||[]).forEach(r=>{if(r&&r.done&&r.w&&r.r)vol+=r.w*r.r;});});
    rows.push({w,vol:Math.round(vol)});
  }
  const has=rows.some(r=>r.vol>0);
  if(!has)return `<div class="card"><div class="note">No completed sets yet — volume appears here as you log.</div></div>`;
  const max=Math.max(...rows.map(r=>r.vol),1);
  const bars=rows.map(r=>{
    const h=Math.round(70*r.vol/max);
    return `<div style="flex:1;text-align:center"><div style="height:80px;display:flex;align-items:flex-end;justify-content:center"><div style="width:60%;height:${h}px;background:var(--accent);border-radius:4px 4px 0 0"></div></div><div style="font-size:9px;color:var(--ink-faint);margin-top:4px">W${r.w}</div></div>`;
  }).join('');
  return `<div class="card"><h3>Weekly Tonnage (lb)</h3><div style="display:flex;gap:6px;align-items:flex-end">${bars}</div>
    <div class="note" style="margin-top:10px">Total weight moved per week (weight × reps on completed sets). Expect a dip in week 4 — that's the deload doing its job.</div></div>`;
}
function progPRs(){
  const u=U();const prs=[];
  Object.keys(LIFT_NAMES).forEach(k=>{
    const dayId=DAY_FOR_LIFT[k];let best=0,bw=0,br=0;
    const scan=logs=>{if(!logs)return;Object.keys(logs).forEach(key=>{const m=key.match(/^w\d+-([a-z]+)-0$/);if(!m||m[1]!==dayId)return;(logs[key]||[]).forEach(r=>{if(r&&r.done&&r.w&&r.r){const e=est1RM(r.w,r.r);if(e>best){best=e;bw=r.w;br=r.r;}}});});};
    scan(u.logs);if(u.prev)scan(u.prev.logs);
    if(best)prs.push({n:LIFT_NAMES[k],e:Math.round(best),bw,br});
  });
  if(!prs.length)return `<div class="card"><div class="note">Complete some main-lift sets and your best estimated 1RMs show up here.</div></div>`;
  return `<div class="card"><h3>Best Estimated 1RMs</h3>${prs.map(p=>`<div class="prrow"><span>${p.n}</span><span><b>${p.e} lb</b> <span style="color:var(--ink-faint)">(${p.bw}×${p.br})</span></span></div>`).join('')}
    <div class="note" style="margin-top:10px">Estimated via the Epley formula from your best completed set. A new best on any lift flags a PR badge on the exercise while you train.</div></div>`;
}
function progHistory(){
  const s=allSessions();
  if(!s.length)return `<div class="card"><div class="note">Your completed sessions will list here, newest first.</div></div>`;
  const nm={sun:'Squat',mon:'Bench',tue:'Pull/Arms',thu:'Deadlift',fri:'Press'};
  return `<div class="card"><h3>Session History</h3>${s.map(x=>
    `<div class="histentry"><div class="ht"><span>Cycle ${x.cycle} · Week ${x.week} — ${nm[x.dayId]||x.dayId}</span><span style="color:var(--steel)">${Math.round(x.volume).toLocaleString()} lb</span></div>
     <div class="hs">${x.setsDone} sets completed</div></div>`).join('')}</div>`;
}
(async()=>{
  const map=['sun','mon','tue','wed','thu','fri','sat'];
  state.day=map[new Date().getDay()];
  renderUsers();renderNav();renderDay();
  const ok=await load();
  if(DEFAULT_SYNC_URL&&!state.syncUrl)state.syncUrl=DEFAULT_SYNC_URL;
  state.day=map[new Date().getDay()];
  renderUsers();renderNav();renderDay();
  if(!ok)setChip('nostore');
  if(state.syncUrl){
    await cloudPull(state.activeUser);
    renderUsers();renderNav();renderDay();
    cloudPush();
  }
  window.addEventListener('pagehide',flushNow);
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState==='hidden'){flushNow();return;}
    if(state.syncUrl){ // app came back to foreground — merge in anything from other devices
      await cloudPull(state.activeUser);
      renderNav();renderDay();
      if(document.getElementById('view-weight').classList.contains('on'))renderWeight();
    }
  });
})();
</script>
