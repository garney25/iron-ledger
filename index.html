<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161B">
<title>Iron Ledger — 6-Week Strength Builder</title>
<style>
:root{
  --bg:#14161B; --surface:#1D2129; --surface2:#252B36; --line:#323A48; --line2:#3D4657;
  --ink:#EFEDE6; --ink-dim:#9AA1AE; --ink-faint:#6B7280;
  --accent:#F2C230; --accent-soft:rgba(242,194,48,.12); --accent-ink:#14161B;
  --steel:#7FA3C7; --good:#6FBF8B; --danger:#E07856;
  --display:'Avenir Next Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
}
body[data-user="shane"]{--accent:#7FA3C7;--accent-soft:rgba(127,163,199,.14);--steel:#F2C230}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body{padding-bottom:112px;max-width:520px;margin:0 auto;transition:background .3s}

/* Header */
.hdr{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hdr .kicker{font-family:var(--display);font-weight:600;letter-spacing:.22em;font-size:10.5px;color:var(--accent);text-transform:uppercase}
.hdr h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;margin-top:2px}
.hdr .sub{color:var(--ink-faint);font-size:11.5px;margin-top:3px}
.userswitch{display:flex;gap:6px;padding-top:4px}
.uchip{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-dim);
  font-family:var(--display);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-direction:column;line-height:1}
.uchip small{font-size:7px;font-family:var(--body);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:2px;color:var(--ink-faint)}
.uchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.uchip.on small{color:var(--accent)}

.chip{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:30;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-faint);
  transition:opacity .3s;opacity:0;pointer-events:none;white-space:nowrap}
.chip.show{opacity:1}
.chip.ok{color:var(--good);border-color:#2f4a3a}
.chip.warn{color:var(--danger);border-color:#5a3a2e}

/* Week strip */
.weeks{display:flex;gap:6px;padding:10px 16px 4px;overflow-x:auto}
.wk{flex:1;min-width:44px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink-dim);
  font-family:var(--display);font-weight:600;text-align:center;padding:7px 0 5px;cursor:pointer}
.wk small{display:block;font-family:var(--body);font-weight:600;font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
.wk .n{font-size:17px;line-height:1.1}
.wk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 14px var(--accent-soft)}
.wk.on small{color:rgba(20,22,27,.6)}

/* Day tabs */
.days{display:flex;gap:5px;padding:8px 16px 6px}
.day{flex:1;text-align:center;padding:8px 0 6px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;position:relative}
.day .d{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.day .f{font-size:8px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);margin-top:1px}
.day.rest .d{color:var(--ink-faint)}
.day.on{border-color:var(--accent);background:var(--accent-soft)}
.day.on .d{color:var(--accent)}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--good);margin:3px auto 0;visibility:hidden}
.day.done .dot{visibility:visible}

/* Session progress */
.sess{padding:2px 16px 10px}
.sess .bar{height:5px;background:var(--surface2);border-radius:999px;overflow:hidden}
.sess .fill{height:100%;background:var(--accent);border-radius:999px;transition:width .35s ease;width:0}
.sess .lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px;font-weight:600}

/* Sections */
.wrap{padding:0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-family:var(--display);font-weight:600;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px}
.focusbar{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 10px}
.focusbar .t{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.focusbar .w{font-family:var(--display);color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase}

.pstrip{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin-bottom:12px}
.pstrip .g{font-family:var(--display);font-weight:700;font-size:21px;color:var(--accent);white-space:nowrap}
.pstrip .k{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.pstrip .s{font-size:10.5px;color:var(--ink-faint);margin-top:1px}

/* Checklist */
.chk{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:none}
.chk-ico{width:34px;height:34px;flex:none;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--ink-faint);display:flex;align-items:center;justify-content:center}
.chk-ico svg{width:27px;height:27px}
.chk.on .chk-ico{opacity:.45}
.chk .box{width:21px;height:21px;border-radius:7px;border:1.5px solid var(--ink-faint);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--accent-ink)}
.chk.on .box{background:var(--good);border-color:var(--good)}
.chk .txt{font-size:13.5px;color:var(--ink-dim)}
.chk.on .txt{color:var(--ink-faint);text-decoration:line-through}

/* Exercise card */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.ex.main-lift{border-color:var(--line2);border-left:3px solid var(--accent)}
.ex-head{padding:12px 13px;cursor:pointer;display:flex;align-items:center;gap:11px}
.ex-ico{width:46px;height:46px;flex:none;background:var(--surface2);border:1px solid var(--line);border-radius:12px;color:var(--ink-dim);display:flex;align-items:center;justify-content:center}
.ex-ico svg{width:38px;height:38px}
.ex-head .nm{font-weight:600;font-size:15px}
.ex-head .tag{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.ex-head .rx{color:var(--ink-dim);font-size:12.5px;margin-top:2px}
.ex-head .load{font-family:var(--display);font-weight:700;font-size:19px;color:var(--steel);white-space:nowrap;text-align:right}
.ex-head .load small{display:block;font-family:var(--body);font-weight:600;font-size:9px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
.ex-body{border-top:1px solid var(--line);padding:10px 13px 13px;display:none}
.ex.open .ex-body{display:block}
.note{font-size:12px;color:var(--ink-faint)}
.prevline{font-size:12px;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;border-radius:9px;padding:6px 10px;margin-bottom:10px;font-weight:600}
.ex-body .note{margin-bottom:10px}
.setrow{display:grid;grid-template-columns:32px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:8px}
.setrow .lbl{font-family:var(--display);font-weight:600;color:var(--ink-faint);font-size:13px;text-align:center}
.setrow input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  font-family:var(--body);font-weight:600;font-size:16px;padding:9px 6px;text-align:center}
.setrow input::placeholder{color:var(--ink-faint);font-weight:400}
.setrow .ok{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink-faint);font-size:16px;cursor:pointer}
.setrow.done input{opacity:.5}
.setrow.done .ok{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.ex-actions{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);color:var(--ink-dim);
  font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Rest day */
.restcard{text-align:center;padding:28px 18px}
.restcard .big{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.restcard p{color:var(--ink-dim);font-size:13.5px;margin-top:8px}
.restcard ul{list-style:none;margin-top:14px;text-align:left}
.restcard li{padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:13.5px}
.restcard li:last-child{border-bottom:none}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:rgba(20,22,27,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;z-index:20}
.nav button{flex:1;padding:13px 0 max(13px, env(safe-area-inset-bottom));background:none;border:none;color:var(--ink-faint);
  font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.nav button.on{color:var(--accent)}

/* Timer bar */
.timer{position:fixed;bottom:48px;left:0;right:0;max-width:520px;margin:0 auto;background:var(--surface2);border-top:1px solid var(--accent);
  display:none;z-index:21;overflow:hidden}
.timer.on{display:block}
.timer .tfill{position:absolute;inset:0;background:var(--accent-soft);transform-origin:left;transition:transform .25s linear}
.timer .trow{position:relative;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.timer .t{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;color:var(--accent)}
.timer .lbl{font-family:var(--display);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.timer button{background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;padding:8px 14px;
  font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.timer.alarm{animation:flash .35s 4}
@keyframes flash{50%{background:var(--danger)}}

/* Weight view */
.big-num{font-family:var(--display);font-weight:700;font-size:46px;line-height:1;text-align:center}
.big-num small{display:block;font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px}
.goalrow{display:flex;justify-content:space-around;margin-top:16px;text-align:center}
.goalrow .v{font-family:var(--display);font-weight:600;font-size:19px;color:var(--steel)}
.goalrow .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
.wlog{display:flex;gap:8px;margin-top:14px}
.wlog input{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:11px;color:var(--ink);
  font-weight:600;font-size:16px;padding:11px 12px;text-align:center}
.wentry{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink-dim)}
.wentry:last-child{border-bottom:none}
.wentry b{color:var(--ink)}
svg text{font-family:var(--body)}

/* Setup */
.maxrow{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;margin-bottom:10px}
.maxrow label{font-size:13.5px;color:var(--ink-dim)}
.maxrow input{background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  font-weight:600;font-size:16px;padding:9px 10px;text-align:center}
.syncrow{display:flex;gap:8px;margin-bottom:8px}
.syncrow input{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  font-size:16px;padding:10px 12px}
.syncstat{font-size:12px;margin-top:6px}
.syncstat.ok{color:var(--good)}
.syncstat.bad{color:var(--danger)}
.bk{width:100%;min-height:72px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;color:var(--ink);
  font-size:12px;font-family:ui-monospace,Menlo,monospace;padding:10px;margin-bottom:8px;word-break:break-all}
.view{display:none}.view.on{display:block}
.hint{font-size:12px;color:var(--ink-faint);padding:0 2px 14px}
</style>
</head>
<body data-user="garney">

<div class="chip" id="chip"></div>

<header class="hdr">
  <div>
    <div class="kicker">6-Week Program</div>
    <h1>Iron Ledger</h1>
    <div class="sub">Strength · Mass · Mobility — rest Wed &amp; Sat</div>
  </div>
  <div class="userswitch" id="userswitch"></div>
</header>

<div id="view-train" class="view on">
  <div class="weeks" id="weeks"></div>
  <div class="days" id="days"></div>
  <div class="sess" id="sess"></div>
  <div class="wrap" id="dayContent"></div>
</div>

<div id="view-weight" class="view"><div class="wrap" id="weightContent" style="padding-top:12px"></div></div>
<div id="view-setup" class="view"><div class="wrap" id="setupContent" style="padding-top:12px"></div></div>

<div class="timer" id="timerBar">
  <div class="tfill" id="tfill"></div>
  <div class="trow">
    <div><div class="lbl">Rest</div><div class="t" id="timerT">0:00</div></div>
    <div style="display:flex;gap:8px">
      <button onclick="addTime(30)">+30s</button>
      <button onclick="stopTimer()">Done</button>
    </div>
  </div>
</div>

<nav class="nav">
  <button id="nav-train" class="on" onclick="switchView('train')">Train</button>
  <button id="nav-weight" onclick="switchView('weight')">Bodyweight</button>
  <button id="nav-setup" onclick="switchView('setup')">Setup</button>
</nav>

<script>
/* ================= PROGRAM ================= */
const MAIN_WAVE=[
 {sets:4,reps:8,pct:70,tag:'Volume · RPE 7'},
 {sets:4,reps:6,pct:75,tag:'Volume · RPE 7–8'},
 {sets:5,reps:5,pct:80,tag:'Strength · RPE 8'},
 {sets:3,reps:5,pct:65,tag:'Deload · easy'},
 {sets:4,reps:4,pct:85,tag:'Heavy · RPE 8–9'},
 {sets:3,reps:3,pct:90,tag:'Peak · RPE 9'}];
const DEAD_WAVE=[
 {sets:4,reps:6,pct:70,tag:'Volume · RPE 7'},
 {sets:4,reps:5,pct:75,tag:'Volume · RPE 7–8'},
 {sets:5,reps:3,pct:80,tag:'Strength · RPE 8'},
 {sets:2,reps:5,pct:65,tag:'Deload · easy'},
 {sets:4,reps:3,pct:85,tag:'Heavy · RPE 8–9'},
 {sets:3,reps:2,pct:90,tag:'Peak · RPE 9'}];
const ACC_NOTE='Add a rep or ~5 lb from last week. Week 4: go lighter, move well.';
const PROGRAM=[
 {id:'sun',d:'Sun',focus:'Lower · Squat',rest:false,
  warmup:['5 min bike or row, easy pace','90/90 hip switches — 8/side','World\u2019s greatest stretch — 5/side','Ankle rocks against wall — 10/side','Bodyweight squats + 30s goblet hold'],
  ex:[
   {n:'Back Squat',wave:MAIN_WAVE,lift:'squat',rest:180},
   {n:'Romanian Deadlift',s:3,r:'8–10',rest:120},
   {n:'Bulgarian Split Squat',s:3,r:'8 / leg',rest:90},
   {n:'Lying Leg Curl',s:3,r:'10–12',rest:90},
   {n:'Standing Calf Raise',s:4,r:'12',rest:60}],
  finish:['Couch stretch — 90s/side','Pigeon stretch — 90s/side']},
 {id:'mon',d:'Mon',focus:'Upper · Bench',rest:false,
  warmup:['Band pull-aparts — 2×15','Shoulder dislocates (band/PVC) — 10','Scap push-ups — 10','Cat-cow — 8','2 light bench warm-up sets'],
  ex:[
   {n:'Barbell Bench Press',wave:MAIN_WAVE,lift:'bench',rest:180},
   {n:'Weighted Pull-Up (or Lat Pulldown)',s:4,r:'6–8',rest:120},
   {n:'Incline Dumbbell Press',s:3,r:'8–10',rest:90},
   {n:'Chest-Supported Row',s:3,r:'10',rest:90},
   {n:'Face Pull',s:3,r:'15',rest:60}],
  finish:['Doorway pec stretch — 60s/side','Thoracic extension over bench — 60s']},
 {id:'tue',d:'Tue',focus:'Pull · Arms',rest:false,
  warmup:['Dead hang — 2×30s','Band rows — 2×15','Thoracic rotations — 8/side','1 light row warm-up set'],
  ex:[
   {n:'Barbell Row',wave:MAIN_WAVE,lift:'row',rest:150},
   {n:'Lat Pulldown or Pull-Ups',s:3,r:'10',rest:90},
   {n:'Seated Cable Row',s:3,r:'10–12',rest:90},
   {n:'Barbell Curl',s:3,r:'10',rest:60},
   {n:'Hammer Curl',s:3,r:'12',rest:60},
   {n:'Farmer\u2019s Carry',s:3,r:'40m heavy',rest:90}],
  finish:['Lat stretch on rack — 60s/side','Dead hang — 45s']},
 {id:'wed',d:'Wed',focus:'Rest',rest:true},
 {id:'thu',d:'Thu',focus:'Lower · Deadlift',rest:false,
  warmup:['5 min bike or row','Glute bridges — 2×12','Hip hinge drill with dowel — 10','Bird dogs — 8/side','2–3 light deadlift warm-up sets'],
  ex:[
   {n:'Deadlift',wave:DEAD_WAVE,lift:'dead',rest:210},
   {n:'Front Squat',s:3,r:'6–8',rest:150},
   {n:'Hip Thrust',s:3,r:'8–10',rest:120},
   {n:'Back Extension',s:3,r:'12',rest:90},
   {n:'Hanging Leg Raise',s:3,r:'10–15',rest:60}],
  finish:['Standing hamstring stretch — 60s/side','Half-kneeling hip flexor stretch — 60s/side']},
 {id:'fri',d:'Fri',focus:'Upper · Press',rest:false,
  warmup:['Band pull-aparts — 2×15','Arm circles + wall slides — 10 each','Scap pull-ups — 8','1–2 light press warm-up sets'],
  ex:[
   {n:'Overhead Press',wave:MAIN_WAVE,lift:'ohp',rest:180},
   {n:'Close-Grip Bench Press',s:3,r:'8',rest:120},
   {n:'One-Arm Dumbbell Row',s:3,r:'10 / side',rest:90},
   {n:'Lateral Raise',s:3,r:'12–15',rest:60},
   {n:'Overhead Triceps Extension',s:3,r:'12',rest:60},
   {n:'Ab Wheel or Plank',s:3,r:'10 / 45s',rest:60}],
  finish:['Cross-body shoulder stretch — 45s/side','Child\u2019s pose + reach — 60s']},
 {id:'sat',d:'Sat',focus:'Rest',rest:true}];
const LIFT_NAMES={squat:'Back Squat',bench:'Bench Press',dead:'Deadlift',ohp:'Overhead Press',row:'Barbell Row'};

/* ================= ILLUSTRATIONS ================= */
const AC='var(--accent)';
const ICONS={
 squat:`<circle cx="26" cy="11" r="3" fill="currentColor" stroke="none"/><path d="M25 14 L19 25 L29 29 L28 40"/><path d="M23 16 L30 13"/><path d="M10 13 L42 13" stroke="${AC}"/><circle cx="13" cy="13" r="2.5" stroke="${AC}"/><circle cx="39" cy="13" r="2.5" stroke="${AC}"/>`,
 hinge:`<circle cx="31" cy="11" r="3" fill="currentColor" stroke="none"/><path d="M29 14 L17 23 L19 32 L18 40"/><path d="M26 16 L28 27"/><path d="M16 28 L40 28" stroke="${AC}"/><circle cx="19" cy="28" r="2.5" stroke="${AC}"/><circle cx="37" cy="28" r="2.5" stroke="${AC}"/>`,
 lunge:`<circle cx="24" cy="9" r="3" fill="currentColor" stroke="none"/><path d="M24 12 L24 26 L32 30 L32 40"/><path d="M24 26 L16 32 L11 39"/><path d="M24 16 L20 27"/><path d="M17 29 L23 29" stroke="${AC}"/>`,
 legcurl:`<path d="M6 31 L36 31"/><path d="M12 27 L30 27"/><circle cx="9" cy="26" r="3" fill="currentColor" stroke="none"/><path d="M30 27 L36 29"/><path d="M36 29 L38 19" stroke="${AC}"/><circle cx="38" cy="18" r="2.5" stroke="${AC}"/>`,

  else if(t.includes('ankle'))k='ankle';

function iconFor(name){

  else if(n.includes('face pull'))k='facepull';
  else if(n.includes('pull-up')||n.includes('pulldown')||n.includes('pull up'))k='pullup';
  else if(n.includes('split squat'))k='lunge';
  else if(n.includes('squat'))k='squat';
  else if(n.includes('romanian')||n.includes('deadlift')||n.includes('back extension'))k='hinge';
  else if(n.includes('calf'))k='calf';
  else if(n.includes('incline'))k='incline';
  else if(n.includes('bench'))k='bench';
  else if(n.includes('row'))k='row';
  else if(n.includes('curl'))k='curl';
  else if(n.includes('carry'))k='carry';

/* ================= STATE / STORAGE / SYNC ================= */
const KEY='iron-ledger-v1';
const USERS=['garney','shane'];
function blankUser(start){return {logs:{},checks:{},weights:[],maxes:{},goal:210,start:start||null,cycle:1,prev:null,updatedAt:0};}
let state={v:3,activeUser:'garney',week:1,day:'sun',syncUrl:'',users:{garney:blankUser(193),shane:blankUser(null)}};
function U(){return state.users[state.activeUser];}
function migrate(s){
  if(s&&s.v===3&&s.users){USERS.forEach(u=>{s.users[u]=Object.assign(blankUser(null),s.users[u]||{});});return s;}
  if(s&&('logs' in s)){ // v1/v2 flat shape -> becomes Garney's profile
    const g=blankUser(s.start||193);
    g.logs=s.logs||{};g.checks=s.checks||{};g.weights=s.weights||[];g.maxes=s.maxes||{};
    g.goal=s.goal||210;g.updatedAt=Date.now();
    return {v:3,activeUser:'garney',week:s.week||1,day:s.day||'sun',syncUrl:'',users:{garney:g,shane:blankUser(null)}};
  }
  return state;
}
function stor(){try{return(window.storage&&typeof window.storage.set==='function')?window.storage:null;}catch(e){return null;}}
function localOK(){try{const t='__il_t';window.localStorage.setItem(t,'1');window.localStorage.removeItem(t);return true;}catch(e){return false;}}
let saveMode=null;
async function load(){
  for(let i=0;i<12;i++){
    const s=stor();
    if(s){
      try{const r=await s.get(KEY);if(r&&r.value)state=migrate(JSON.parse(r.value));}catch(e){}
      saveMode='claude';return true;
    }
    await new Promise(r=>setTimeout(r,250));
  }
  if(localOK()){
    saveMode='local';
    try{const v=window.localStorage.getItem(KEY);if(v)state=migrate(JSON.parse(v));}catch(e){}
    return true;
  }
  return false;
}
let chipT=null;
function setChip(m){
  const c=document.getElementById('chip');if(!c)return;clearTimeout(chipT);
  c.className='chip';
  const fade=()=>{chipT=setTimeout(()=>c.classList.remove('show'),1400);};
  if(m==='saving'){c.textContent='Saving…';c.classList.add('show');}
  else if(m==='synced'){c.textContent='Synced to cloud ✓';c.classList.add('show','ok');fade();}
  else if(m==='saved'){c.textContent='Saved ✓';c.classList.add('show','ok');fade();}
  else if(m==='savedLocal'){c.textContent='Saved on device ✓';c.classList.add('show','ok');fade();}
  else if(m==='offline'){c.textContent='Saved on device — will sync ✓';c.classList.add('show','ok');fade();}
  else if(m==='nostore'){c.textContent='Not saving — check connection';c.classList.add('show','warn');}
  else if(m==='failed'){c.textContent='Save failed — will retry';c.classList.add('show','warn');}
}
let saveT=null,pendingCloud=false;
async function writeLocal(payload){
  const s=stor();
  if(saveMode!=='local'&&s){
    try{await s.set(KEY,payload);if(localOK()){try{window.localStorage.setItem(KEY,payload);}catch(e){}}return 'claude';}
    catch(e){}
  }
  if(localOK()){try{window.localStorage.setItem(KEY,payload);saveMode='local';return 'local';}catch(e){}}
  return null;
}
function cloudPath(user){return state.syncUrl.replace(/\/+$/,'')+'/iron-ledger/users/'+user+'.json';}
async function cloudPush(){
  if(!state.syncUrl)return 'nosync';
  try{
    const r=await fetch(cloudPath(state.activeUser),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(U())});
    return r.ok?'ok':'fail';
  }catch(e){return 'fail';}
}
async function cloudPull(user,force){
  if(!state.syncUrl)return false;
  try{
    const r=await fetch(cloudPath(user)+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return false;
    const remote=await r.json();
    if(remote&&typeof remote==='object'){
      const local=state.users[user];
      if(force||(remote.updatedAt||0)>(local.updatedAt||0)){state.users[user]=Object.assign(blankUser(null),remote);}
      else if((local.updatedAt||0)>(remote.updatedAt||0)){pendingCloud=true;}
      return true;
    }
  }catch(e){}
  return false;
}
async function writeState(){
  U().updatedAt=Date.now();
  const payload=JSON.stringify(state);
  const localRes=await writeLocal(payload);
  const cloudRes=await cloudPush();
  if(cloudRes==='ok'){setChip('synced');return true;}
  if(localRes){setChip(state.syncUrl?'offline':(localRes==='claude'?'saved':'savedLocal'));return true;}
  setChip('failed');saveT=setTimeout(writeState,2500);return false;
}
function save(){clearTimeout(saveT);setChip('saving');saveT=setTimeout(writeState,300);}
function flushNow(){clearTimeout(saveT);writeState();}

/* ================= HELPERS ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function roundLoad(x){return Math.round(x/5)*5;}
function targetLoad(lift,pct){const m=U().maxes[lift];return m?roundLoad(m*pct/100):null;}
function logKey(exIdx){return 'w'+state.week+'-'+state.day+'-'+exIdx;}
function dayDone(week,dayId){
  const day=PROGRAM.find(p=>p.id===dayId);if(!day||day.rest)return false;
  return day.ex.every((ex,i)=>{
    const n=ex.wave?ex.wave[week-1].sets:ex.s;
    const rows=U().logs['w'+week+'-'+dayId+'-'+i]||[];
    let c=0;rows.forEach(r=>{if(r&&r.done)c++;});return c>=n;
  });
}
function currentBW(){
  const ws=[...U().weights].sort((a,b)=>a.d.localeCompare(b.d));
  return ws.length?ws[ws.length-1].lbs:U().start;
}
function proteinTarget(){const bw=currentBW();return bw?Math.round(bw):null;}
function proteinStrip(){
  const p=proteinTarget();
  const val=p?('~'+p+' g'):'— g';
  const sub=p?'1 g per lb of bodyweight — updates with weigh-ins':'Log a weigh-in or set a start weight in Setup';
  return `<div class="pstrip"><div><div class="k">Protein Today</div><div class="s">${sub}</div></div><div class="g">${val}</div></div>`;
}
function displayName(u){return u.charAt(0).toUpperCase()+u.slice(1);}

/* ================= NAV RENDER ================= */
function renderUsers(){
  document.getElementById('userswitch').innerHTML=USERS.map(u=>
    `<div class="uchip${u===state.activeUser?' on':''}" onclick="switchUser('${u}')">${u.charAt(0).toUpperCase()}<small>${displayName(u)}</small></div>`).join('');
  document.body.dataset.user=state.activeUser;
}
async function switchUser(u){
  if(u===state.activeUser)return;
  flushNow();
  state.activeUser=u;openEx.clear();
  renderUsers();renderNav();renderDay();
  if(document.getElementById('view-weight').classList.contains('on'))renderWeight();
  if(document.getElementById('view-setup').classList.contains('on'))renderSetup();
  setChip('saving');
  await cloudPull(u);
  renderNav();renderDay();
  if(document.getElementById('view-weight').classList.contains('on'))renderWeight();
  save();
}
function renderNav(){
  const wl=['Volume','Volume','Strength','Deload','Heavy','Peak'];
  document.getElementById('weeks').innerHTML=[1,2,3,4,5,6].map(w=>
    `<div class="wk${w===state.week?' on':''}" onclick="setWeek(${w})"><div class="n">${w}</div><small>${wl[w-1]}</small></div>`).join('');
  document.getElementById('days').innerHTML=PROGRAM.map(p=>
    `<div class="day${p.rest?' rest':''}${p.id===state.day?' on':''}${dayDone(state.week,p.id)?' done':''}" onclick="setDay('${p.id}')">
      <div class="d">${p.d}</div><div class="f">${p.rest?'rest':esc(p.focus.split('·')[1]||p.focus)}</div><div class="dot"></div></div>`).join('');
  renderSess();
}
function sessCounts(){
  const day=PROGRAM.find(p=>p.id===state.day);
  if(!day||day.rest)return null;
  let total=0,done=0;
  day.ex.forEach((ex,i)=>{
    const n=ex.wave?ex.wave[state.week-1].sets:ex.s;total+=n;
    (U().logs[logKey(i)]||[]).forEach(r=>{if(r&&r.done)done++;});
  });
  return {total,done:Math.min(done,total)};
}
function renderSess(){
  const el=document.getElementById('sess');
  const c=sessCounts();
  if(!c){el.innerHTML='';return;}
  const pct=c.total?Math.round(100*c.done/c.total):0;
  el.innerHTML=`<div class="bar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="lbl"><span>${displayName(state.activeUser)} · Session</span><span>${c.done} / ${c.total} sets</span></div>`;
}
function setWeek(w){state.week=w;openEx.clear();save();renderNav();renderDay();}
function setDay(d){state.day=d;openEx.clear();save();renderNav();renderDay();}
const openEx=new Set();
function toggleOpen(i){
  const el=document.getElementById('ex'+i);
  const on=el.classList.toggle('open');
  if(on)openEx.add(i);else openEx.delete(i);
}

/* ================= DAY RENDER ================= */
function renderDay(){
  const day=PROGRAM.find(p=>p.id===state.day);
  const el=document.getElementById('dayContent');
  if(day.rest){
    const p=proteinTarget();
    el.innerHTML=proteinStrip()+`<div class="card restcard">
      <div class="big">Rest Day</div>
      <p>Growth happens here. Keep it easy today:</p>
      <ul><li>20–30 min walk</li><li>10 min light mobility — hips, shoulders, ankles</li><li>Hit your calorie surplus and ${p?('~'+p+'g'):'your'} protein — rest days count just as much</li><li>Sleep 7–9 hours</li></ul></div>`;
    return;
  }
  const wk=state.week;
  let html=`<div class="focusbar"><div class="t">${esc(day.focus)}</div><div class="w">Week ${wk}${(U().cycle||1)>1?' · Cycle '+U().cycle:''}</div></div>`;
  html+=proteinStrip();
  html+=`<div class="card"><h3>Warm-Up · Mobility</h3>`+
    day.warmup.map((w,i)=>{
      const k='w'+wk+'-'+day.id+'-wu'+i;const on=U().checks[k];
      return `<div class="chk${on?' on':''}" onclick="toggleCheck('${k}')"><div class="box">${on?'✓':''}</div><div class="chk-ico">${wuIconFor(w)}</div><div class="txt">${esc(w)}</div></div>`;
    }).join('')+`</div>`;
  day.ex.forEach((ex,i)=>{
    const scheme=ex.wave?ex.wave[wk-1]:null;
    const nSets=scheme?scheme.sets:ex.s;
    const repsTxt=scheme?scheme.reps:ex.r;
    const load=scheme?targetLoad(ex.lift,scheme.pct):null;
    const rows=U().logs[logKey(i)]||[];
    const doneCount=rows.filter(r=>r&&r.done).length;
    const open=openEx.has(i)||(doneCount>0&&doneCount<nSets);
    let setRows='';
    for(let s=0;s<nSets;s++){
      const r=rows[s]||{};
      setRows+=`<div class="setrow${r.done?' done':''}">
        <div class="lbl">${s+1}</div>
        <input type="number" inputmode="decimal" placeholder="lb" value="${r.w??''}" onchange="setVal(${i},${s},'w',this.value)">
        <input type="number" inputmode="numeric" placeholder="reps" value="${r.r??''}" onchange="setVal(${i},${s},'r',this.value)">
        <button class="ok" onclick="toggleSet(${i},${s},${ex.rest||90})">${r.done?'✓':'○'}</button>
      </div>`;
    }
    html+=`<div class="ex${scheme?' main-lift':''}${open?' open':''}" id="ex${i}">
      <div class="ex-head" onclick="toggleOpen(${i})">
        <div class="ex-ico">${iconFor(ex.n)}</div>
        <div style="flex:1">
          ${scheme?`<span class="tag">Main Lift · ${esc(scheme.tag)}</span>`:''}
          <div class="nm">${esc(ex.n)}</div>
          <div class="rx">${nSets} × ${esc(repsTxt)}${scheme?` @ ${scheme.pct}%`:''} · rest ${fmtRest(ex.rest||90)}</div>
        </div>
        ${scheme?(load
          ?`<div class="load">${load}<small>target lb</small></div>`
          :`<div class="load" style="font-size:12px;color:var(--ink-faint)">set 1RM →<small>Setup</small></div>`):''}
      </div>
      <div class="ex-body">
        ${scheme?'':`<div class="note">${ACC_NOTE}</div>`}
        ${prevLine(i)}
        ${setRows}
        <div class="ex-actions"><button class="btn" onclick="startTimer(${ex.rest||90})">Rest ${fmtRest(ex.rest||90)}</button></div>
      </div>
    </div>`;
  });
  html+=`<div class="card"><h3>Finisher · Stretch</h3>`+
    day.finish.map((f,i)=>{
      const k='w'+wk+'-'+day.id+'-fn'+i;const on=U().checks[k];
      return `<div class="chk${on?' on':''}" onclick="toggleCheck('${k}')"><div class="box">${on?'✓':''}</div><div class="chk-ico">${wuIconFor(f)}</div><div class="txt">${esc(f)}</div></div>`;
    }).join('')+`</div>`;
  html+=`<div class="hint">Tap an exercise to log sets — the timer sounds when rest is up.</div>`;
  el.innerHTML=html;
}
function fmtRest(s){return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s+'s';}
function toggleCheck(k){U().checks[k]=!U().checks[k];save();renderDay();}
function setVal(exIdx,setIdx,field,val){
  const k=logKey(exIdx);if(!U().logs[k])U().logs[k]=[];
  if(!U().logs[k][setIdx])U().logs[k][setIdx]={};
  U().logs[k][setIdx][field]=val===''?null:Number(val);save();
}
function toggleSet(exIdx,setIdx,rest){
  const k=logKey(exIdx);if(!U().logs[k])U().logs[k]=[];
  if(!U().logs[k][setIdx])U().logs[k][setIdx]={};
  const r=U().logs[k][setIdx];r.done=!r.done;save();
  if(r.done)startTimer(rest);
  renderNav();renderDay();
}

/* ================= CYCLES ================= */
function prevLine(exIdx){
  const p=U().prev;if(!p||!p.logs)return '';
  const rows=p.logs[logKey(exIdx)];if(!rows||!rows.length)return '';
  const parts=rows.filter(r=>r&&(r.w!=null||r.r!=null)).map(r=>`${r.w??'—'}×${r.r??'—'}`);
  if(!parts.length)return '';
  return `<div class="prevline">Last cycle · ${parts.join(' · ')} lb</div>`;
}
let cycleArm=false;
function startNewCycle(){
  const btn=document.getElementById('cycleBtn');
  if(!cycleArm){
    cycleArm=true;
    if(btn)btn.textContent='Tap again to confirm';
    setTimeout(()=>{cycleArm=false;const b=document.getElementById('cycleBtn');if(b)b.textContent='Start New Cycle';},4000);
    return;
  }
  cycleArm=false;
  const u=U();
  u.prev={cycle:u.cycle||1,logs:u.logs,archivedOn:new Date().toISOString().slice(0,10)};
  u.cycle=(u.cycle||1)+1;
  u.logs={};u.checks={};
  state.week=1;openEx.clear();
  save();renderNav();renderDay();renderSetup();
}

/* ================= TIMER + ALARM ================= */
let timerEnd=null,timerInt=null,timerTotal=0,audioCtx=null;
function armAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
function beep(){
  try{
    if(!audioCtx)return;
    const t=audioCtx.currentTime;
    [0,0.22,0.44,0.66].forEach(off=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='square';o.frequency.value=880;
      o.connect(g);g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001,t+off);
      g.gain.exponentialRampToValueAtTime(0.35,t+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+off+0.18);
      o.start(t+off);o.stop(t+off+0.2);
    });
  }catch(e){}
}
function startTimer(sec){
  armAudio(); // must happen inside the user's tap for phone audio to be allowed
  timerTotal=sec;timerEnd=Date.now()+sec*1000;
  const bar=document.getElementById('timerBar');
  bar.classList.remove('alarm');bar.classList.add('on');
  clearInterval(timerInt);timerInt=setInterval(tick,250);tick();
}
function addTime(s){if(timerEnd){timerEnd+=s*1000;timerTotal+=s;}}
function stopTimer(){clearInterval(timerInt);timerEnd=null;
  const bar=document.getElementById('timerBar');bar.classList.remove('on','alarm');}
function tick(){
  const left=Math.max(0,Math.round((timerEnd-Date.now())/1000));
  document.getElementById('timerT').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  const frac=timerTotal?Math.max(0,Math.min(1,left/timerTotal)):0;
  document.getElementById('tfill').style.transform='scaleX('+frac+')';
  if(left<=0){
    clearInterval(timerInt);timerEnd=null;
    const bar=document.getElementById('timerBar');
    bar.classList.add('alarm');
    beep();
    try{navigator.vibrate&&navigator.vibrate([200,100,200,100,300]);}catch(e){}
    setTimeout(()=>bar.classList.remove('on','alarm'),2000);
  }
}

/* ================= BODYWEIGHT ================= */
function renderWeight(){
  const el=document.getElementById('weightContent');
  const u=U();
  const ws=[...u.weights].sort((a,b)=>a.d.localeCompare(b.d));
  const cur=ws.length?ws[ws.length-1].lbs:u.start;
  let chart='';
  if(ws.length>=2&&u.goal){
    const W=440,H=140,P=14;
    const base=u.start||ws[0].lbs;
    const min=Math.min(base,...ws.map(w=>w.lbs))-2;
    const max=Math.max(u.goal,...ws.map(w=>w.lbs))+2;
    const x=i=>P+(W-2*P)*i/(ws.length-1);
    const y=v=>H-P-(H-2*P)*(v-min)/(max-min);
    const pts=ws.map((w,i)=>x(i)+','+y(w.lbs)).join(' ');
    chart=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:14px">
      <line x1="${P}" y1="${y(u.goal)}" x2="${W-P}" y2="${y(u.goal)}" stroke="var(--accent)" stroke-dasharray="4 4" stroke-width="1"/>
      <text x="${W-P}" y="${y(u.goal)-4}" fill="var(--accent)" font-size="10" text-anchor="end">goal ${u.goal}</text>
      <polyline points="${pts}" fill="none" stroke="var(--steel)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${ws.map((w,i)=>`<circle cx="${x(i)}" cy="${y(w.lbs)}" r="3.5" fill="var(--steel)"/>`).join('')}
    </svg>`;
  }
  const gained=(cur&&u.start)?(cur-u.start).toFixed(1):null;
  const toGo=(cur&&u.goal)?(u.goal-cur).toFixed(1):null;
  el.innerHTML=`
    <div class="card">
      <div class="big-num">${cur??'—'}<small>${displayName(state.activeUser)} · current lb</small></div>
      <div class="goalrow">
        <div><div class="v">${u.start??'—'}</div><div class="k">start</div></div>
        <div><div class="v" style="color:${gained===null?'var(--ink-faint)':(gained>=0?'var(--good)':'var(--danger)')}">${gained===null?'—':(gained>0?'+':'')+gained}</div><div class="k">gained</div></div>
        <div><div class="v">${toGo??'—'}</div><div class="k">to ${u.goal??'goal'}</div></div>
      </div>
      ${chart}
      <div class="wlog">
        <input type="number" inputmode="decimal" step="0.1" id="wIn" placeholder="Today's weight">
        <button class="btn primary" style="flex:0 0 84px" onclick="logWeight()">Log</button>
      </div>
      <div class="note" style="margin-top:10px">Weigh in 2–3×/week, same time of day. Aim for +0.75–1.5 lb/week; if the line stalls two weeks, add ~150 calories/day.${proteinTarget()?(' Protein: ~'+proteinTarget()+' g/day at current weight.'):''}</div>
    </div>
    <div class="card"><h3>Log</h3>${ws.length?[...ws].reverse().map(w=>
      `<div class="wentry"><span>${w.d}</span><span><b>${w.lbs} lb</b> <span style="color:var(--danger);cursor:pointer;margin-left:8px" onclick="delWeight('${w.d}',${w.lbs})">✕</span></span></div>`).join('')
      :'<div class="note">No entries yet. Log your first weigh-in above.</div>'}</div>`;
}
function logWeight(){
  const v=Number(document.getElementById('wIn').value);
  if(!v||v<80||v>500)return;
  const d=new Date().toISOString().slice(0,10);
  U().weights=U().weights.filter(w=>w.d!==d);
  U().weights.push({d,lbs:v});
  if(!U().start)U().start=v;
  save();renderWeight();
}
function delWeight(d,lbs){U().weights=U().weights.filter(w=>!(w.d===d&&w.lbs===lbs));save();renderWeight();}

/* ================= SETUP ================= */
function renderSetup(){
  const el=document.getElementById('setupContent');
  const u=U();
  el.innerHTML=`
  <div class="card"><h3>${displayName(state.activeUser)} — 1-Rep Maxes</h3>
    <div class="note" style="margin-bottom:12px">Every main-lift target is calculated from these. Best estimates are fine; retest after week 6.</div>
    ${Object.keys(LIFT_NAMES).map(k=>`<div class="maxrow"><label>${LIFT_NAMES[k]}</label>
      <input type="number" inputmode="decimal" placeholder="lb" value="${u.maxes[k]??''}" onchange="setMax('${k}',this.value)"></div>`).join('')}
  </div>
  <div class="card"><h3>${displayName(state.activeUser)} — Bodyweight Goal</h3>
    <div class="maxrow"><label>Start weight (lb)</label><input type="number" inputmode="decimal" value="${u.start??''}" onchange="setBW('start',this.value)"></div>
    <div class="maxrow"><label>Goal weight (lb)</label><input type="number" inputmode="decimal" value="${u.goal??''}" onchange="setBW('goal',this.value)"></div>
  </div>
  <div class="card"><h3>${displayName(state.activeUser)} — Program Cycle</h3>
    <div class="note" style="margin-bottom:10px">Currently on <b style="color:var(--ink)">Cycle ${u.cycle||1}</b>${u.prev?` — Cycle ${u.prev.cycle} archived ${u.prev.archivedOn||''}. Its numbers show as “Last cycle” on every exercise.`:'. Finish the 6 weeks, retest your maxes, then restart here.'}</div>
    <div class="ex-actions"><button class="btn" id="cycleBtn" onclick="startNewCycle()">Start New Cycle</button></div>
    <div class="note" style="margin-top:8px">Archives this cycle's logs for reference and clears the board back to Week 1. Bodyweight history and 1RMs carry over — update your maxes after retesting so the new cycle's targets rise with you.</div>
  </div>
  <div class="card"><h3>Cloud Sync</h3>
    <div class="note" style="margin-bottom:10px">Paste your Firebase database URL once per phone. After that, every set syncs automatically — both profiles, all devices, no backup codes needed.</div>
    <div class="syncrow"><input id="syncIn" placeholder="https://your-project-default-rtdb.firebaseio.com" value="${esc(state.syncUrl||'')}"></div>
    <div class="ex-actions"><button class="btn primary" onclick="connectSync()">Connect &amp; Sync</button>${state.syncUrl?'<button class="btn" onclick="syncNow()">Sync Now</button>':''}</div>
    <div class="syncstat" id="syncStat">${state.syncUrl?'Connected — data syncs on every save.':'Not connected — data is saved on this device only.'}</div>
  </div>
  <div class="card"><h3>Backup &amp; Restore (fallback)</h3>
    <div class="note" style="margin-bottom:10px">With sync connected you won't need these. Kept as a manual fallback and for moving data by hand.</div>
    <div class="ex-actions" style="margin-bottom:10px"><button class="btn" onclick="exportData()">Copy Backup Code</button></div>
    <textarea class="bk" id="bkArea" placeholder="Paste a backup code here to restore"></textarea>
    <div class="ex-actions"><button class="btn" onclick="importData()">Restore From Code</button></div>
    <div class="note" id="bkMsg" style="margin-top:8px"></div>
  </div>
  <div class="card"><h3>How the wave works</h3>
    <div class="note">Weeks 1–2 build volume at 70–75%. Week 3 pushes strength at 80%. Week 4 is a deliberate deload — go light, move crisply, let recovery catch up. Weeks 5–6 go heavy at 85–90%. If a target feels harder than the listed RPE, cut 5–10 lb; if easier, add 5. Never grind reps in weeks 1–4.</div></div>`;
}
function setMax(k,v){U().maxes[k]=v===''?null:Number(v);save();renderNav();renderDay();}
function setBW(k,v){U()[k]=v===''?null:Number(v);save();}
async function connectSync(){
  const inp=document.getElementById('syncIn');
  const stat=document.getElementById('syncStat');
  let url=(inp.value||'').trim().replace(/\/+$/,'');
  if(!/^https:\/\//.test(url)){stat.textContent='URL must start with https://';stat.className='syncstat bad';return;}
  stat.textContent='Testing connection…';stat.className='syncstat';
  state.syncUrl=url;
  try{
    const r=await fetch(cloudPath(state.activeUser)+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const remote=await r.json();
    if(remote&&(remote.updatedAt||0)>(U().updatedAt||0)){
      state.users[state.activeUser]=Object.assign(blankUser(null),remote);
      stat.textContent='Connected ✓ — cloud data loaded for '+displayName(state.activeUser)+'.';
    }else{
      await cloudPush();
      stat.textContent='Connected ✓ — this device\u2019s data uploaded to the cloud.';
    }
    stat.className='syncstat ok';
    save();renderNav();renderDay();renderSetup();
    document.getElementById('syncStat').textContent='Connected ✓ — data syncs on every save.';
    document.getElementById('syncStat').className='syncstat ok';
  }catch(e){
    state.syncUrl='';
    stat.textContent='Couldn\u2019t reach that URL — check it and that database rules allow read/write.';
    stat.className='syncstat bad';
  }
}
async function syncNow(){
  const stat=document.getElementById('syncStat');
  stat.textContent='Syncing…';stat.className='syncstat';
  const ok=await cloudPull(state.activeUser);
  await cloudPush();
  renderNav();renderDay();
  stat.textContent=ok?'Synced ✓':'Sync failed — check connection.';
  stat.className='syncstat '+(ok?'ok':'bad');
}

/* ================= BACKUP (fallback) ================= */
function exportData(){
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  const ta=document.getElementById('bkArea');ta.value=code;
  const msg=document.getElementById('bkMsg');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(
      ()=>{msg.textContent='Copied to clipboard ✓';},
      ()=>{ta.focus();ta.select();msg.textContent='Code shown above — long-press to copy.';});
  }else{ta.focus();ta.select();msg.textContent='Code shown above — long-press to copy.';}
}
function importData(){
  const msg=document.getElementById('bkMsg');
  const v=document.getElementById('bkArea').value.trim();
  if(!v){msg.textContent='Paste a backup code first.';return;}
  try{
    const s=JSON.parse(decodeURIComponent(escape(atob(v))));
    if(!s||typeof s!=='object')throw new Error('bad');
    const syncUrl=state.syncUrl;
    state=migrate(s);
    if(syncUrl&&!state.syncUrl)state.syncUrl=syncUrl;
    U().updatedAt=Date.now();
    save();renderUsers();renderNav();renderSetup();
    msg.textContent='Restored ✓ — data loaded'+(state.syncUrl?' and syncing to cloud.':'.');
  }catch(e){msg.textContent='That code didn\u2019t parse — make sure you pasted the whole thing.';}
}

/* ================= VIEWS / INIT ================= */
function switchView(v){
  ['train','weight','setup'].forEach(x=>{
    document.getElementById('view-'+x).classList.toggle('on',x===v);
    document.getElementById('nav-'+x).classList.toggle('on',x===v);
  });
  if(v==='weight')renderWeight();
  if(v==='setup')renderSetup();
}
(async()=>{
  const map=['sun','mon','tue','wed','thu','fri','sat'];
  state.day=map[new Date().getDay()];
  renderUsers();renderNav();renderDay();
  const ok=await load();
  state.day=map[new Date().getDay()];
  renderUsers();renderNav();renderDay();
  if(!ok)setChip('nostore');
  if(state.syncUrl){
    await cloudPull(state.activeUser);
    renderUsers();renderNav();renderDay();
    if(pendingCloud){pendingCloud=false;cloudPush();}
  }
  window.addEventListener('pagehide',flushNow);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushNow();});
})();
</script>
