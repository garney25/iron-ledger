<!doctype html>
<!-- Ruby Ledger · v3 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruby Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17101a; --bg-grad:#1e1322;
    --surface:#211527; --surface-2:#2b1a33; --raised:#341f3d;
    --line:#3d2846; --line-soft:#31203a;
    --text:#f7edf3; --muted:#bb9fae; --faint:#8a7181;
    --pink:#ff3d7f; --pink-soft:#ff8fb7; --pink-deep:#c71e5b; --pink-wash:#3a1826;
    --gold:#f6c9a6; --done:#5fe0a6; --done-wash:#153027; --warn:#f6c9a6;
    --shadow:0 18px 40px -22px rgba(0,0,0,.7);
    --r:16px; --r-sm:11px;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --disp:'Space Grotesk','Inter',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      color-scheme:light;
      --bg:#fdf3f8; --bg-grad:#fbe9f2;
      --surface:#ffffff; --surface-2:#fdeef5; --raised:#fbe3ee;
      --line:#f3d2e1; --line-soft:#f8e2ec;
      --text:#2c1622; --muted:#8b6076; --faint:#a98498;
      --pink:#e11665; --pink-soft:#f06a9c; --pink-deep:#b30f52; --pink-wash:#fde3ee;
      --gold:#b9722f; --done:#0f9d6b; --done-wash:#e2f6ee; --warn:#b9722f;
      --shadow:0 16px 34px -24px rgba(120,20,70,.4);
    }
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#fdf3f8; --bg-grad:#fbe9f2;
    --surface:#ffffff; --surface-2:#fdeef5; --raised:#fbe3ee;
    --line:#f3d2e1; --line-soft:#f8e2ec;
    --text:#2c1622; --muted:#8b6076; --faint:#a98498;
    --pink:#e11665; --pink-soft:#f06a9c; --pink-deep:#b30f52; --pink-wash:#fde3ee;
    --gold:#b9722f; --done:#0f9d6b; --done-wash:#e2f6ee; --warn:#b9722f;
    --shadow:0 16px 34px -24px rgba(120,20,70,.4);
  }
  :root[data-theme="dark"]{ color-scheme:dark; }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--text);
    background:radial-gradient(120% 60% at 100% 0%, var(--bg-grad) 0%, transparent 60%),var(--bg);
    min-height:100vh;-webkit-font-smoothing:antialiased;padding:0 0 150px}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}
  button{font-family:inherit;cursor:pointer}
  input,textarea{font-family:inherit}
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  header{padding:22px 16px 6px;max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:25px;margin:0;letter-spacing:-.02em}
  .brand h1 em{font-style:normal;color:var(--pink)}
  .hbtns{display:flex;gap:8px}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
    color:var(--muted);font-size:14px;font-weight:600;display:grid;place-items:center;transition:.15s}
  .icon-btn:hover{color:var(--pink);border-color:var(--pink)}

  .weeks{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 2px;max-width:760px;margin:0 auto;scrollbar-width:none}
  .weeks::-webkit-scrollbar{display:none}
  .wk{flex:0 0 auto;min-width:66px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 9px;text-align:center;transition:.15s}
  .wk .n{font-family:var(--disp);font-size:16px;font-weight:600;line-height:1}
  .wk small{font-size:9.5px;color:var(--faint);letter-spacing:.02em;text-transform:uppercase;display:block;margin-top:2px}
  .wk.on{background:var(--pink);border-color:var(--pink)}
  .wk.on .n,.wk.on small{color:#fff}
  .wk.deload.on{background:var(--gold);border-color:var(--gold)}
  .wk.deload.on .n,.wk.deload.on small{color:#231018}

  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:8px 12px 6px;max-width:760px;margin:0 auto}
  .day-pill{min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 3px;text-align:center;transition:.15s;position:relative}
  .day-pill .dow{font-size:9px;font-weight:600;color:var(--faint);letter-spacing:.02em;text-transform:uppercase}
  .day-pill .lbl{font-size:10.5px;font-weight:600;color:var(--text);margin-top:2px;line-height:1.1;white-space:nowrap;letter-spacing:-.01em}
  .day-pill.today{border-color:var(--pink)}
  .day-pill.today .dow{color:var(--pink)}
  .day-pill.active{background:var(--pink);border-color:var(--pink)}
  .day-pill.active .dow,.day-pill.active .lbl{color:#fff}
  .day-pill .dot{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--done)}
  .day-pill.active .dot{background:#fff}

  .hero{margin-top:14px;background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 18px;box-shadow:var(--shadow)}
  .hero .eyebrow{font-size:12px;color:var(--pink);font-weight:600;letter-spacing:.03em}
  .hero h2{font-family:var(--disp);font-weight:600;font-size:29px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.02em}
  .hero .focus{color:var(--muted);font-size:14px}
  .hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{font-size:12px;color:var(--muted);background:var(--raised);border:1px solid var(--line-soft);padding:5px 10px;border-radius:999px}
  .chip b{color:var(--text);font-weight:600}

  .sess{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .sess .bar{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .sess .fill{height:100%;background:var(--pink);border-radius:999px;transition:width .35s ease;width:0}
  .sess .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px;font-weight:600}
  .sess .lbl b{color:var(--pink)}
  .pstrip{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .pstrip .k{font-size:12px;font-weight:700;color:var(--text)}
  .pstrip .s{font-size:11px;color:var(--faint);margin-top:2px;line-height:1.35}
  .pstrip .g{font-family:var(--disp);font-size:20px;font-weight:600;color:var(--pink);white-space:nowrap}

  .weekbanner{margin-top:12px;border-radius:13px;padding:13px 15px;border:1px solid var(--pink-deep);background:linear-gradient(100deg,var(--pink-wash),transparent)}
  .weekbanner.deload{border-color:var(--gold);background:linear-gradient(100deg,color-mix(in srgb,var(--gold) 18%,transparent),transparent)}
  .weekbanner .wl{font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--pink)}
  .weekbanner.deload .wl{color:var(--gold)}
  .weekbanner .wc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}

  .block{margin-top:18px}
  .block-head{display:flex;align-items:center;gap:10px;margin:0 2px 10px;cursor:pointer;user-select:none}
  .block-head h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0}
  .block-head .bh-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .block-head .hint{font-size:11.5px;color:var(--faint);text-align:right}
  .block-head .chev{color:var(--faint);font-size:14px;transition:transform .2s}
  .block-head .chev.closed{transform:rotate(-90deg)}
  .block-head.prime{border-left:3px solid var(--pink);padding-left:10px}

  .ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;margin-bottom:10px}
  .ex.ss{border-color:var(--pink-deep)}
  .ex.custom{border-style:dashed;border-color:var(--pink-soft)}
  .ex-head{display:flex;align-items:flex-start;gap:11px;cursor:pointer}
  .ex-ico{width:32px;height:32px;flex:0 0 auto;color:var(--pink);opacity:.92}
  .ex-ico svg{width:100%;height:100%;display:block}
  .ex-main{flex:1;min-width:0}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--pink);margin-bottom:2px;letter-spacing:.02em}
  .ex-name{font-weight:600;font-size:15px;line-height:1.2}
  .ex-name .ss-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--pink);border:1px solid var(--pink);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
  .ex-rx{font-size:12px;color:var(--muted);margin-top:2px}
  .ex-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
  .ex-right .load{color:var(--gold);font-weight:700;font-size:13px;white-space:nowrap}
  .ex-right .load.set1rm{color:var(--faint);font-weight:500;font-size:11px}
  .ex-right .row2{display:flex;align-items:center;gap:6px}
  .ex-status{font-size:11px;color:var(--faint);font-weight:600;white-space:nowrap}
  .ex-status.full{color:var(--done)}
  .edit-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--faint);font-size:12px;display:grid;place-items:center}
  .edit-btn:hover{color:var(--pink);border-color:var(--pink)}
  .chev-ex{color:var(--faint);font-size:13px;transition:transform .2s}
  .chev-ex.closed{transform:rotate(-90deg)}
  .ex-note{font-size:11.5px;color:var(--faint);margin-top:8px}
  .est{font-size:11px;color:var(--gold);margin-top:6px;font-weight:500}
  .ex-body{margin-top:4px}

  .sets{margin-top:9px}
  .set-row{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:7px;align-items:center;padding:5px 0;border-top:1px solid var(--line-soft)}
  .set-row:first-child{border-top:none}
  .set-n{font-size:12px;color:var(--faint);font-weight:600;text-align:center}
  .set-row .field{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .set-row .field input{width:100%;border:none;background:transparent;color:var(--text);font-size:15px;font-weight:600;padding:8px 4px 8px 9px;text-align:right;min-width:0}
  .set-row .field .u{font-size:11px;color:var(--faint);padding:0 8px 0 2px;white-space:nowrap}
  .set-row .field:focus-within{border-color:var(--pink)}
  .last{grid-column:2 / 4;font-size:10.5px;color:var(--faint);margin:-2px 0 2px;padding-left:2px}
  .last b{color:var(--pink-soft);font-weight:600}
  .check{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface-2);color:transparent;font-size:15px;display:grid;place-items:center;transition:.13s;justify-self:end}
  .check.on{background:var(--done-wash);border-color:var(--done);color:var(--done)}
  .rest-btn-row{display:flex;justify-content:flex-end;padding:4px 0 0}
  .mini-btn{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600}
  .mini-btn:hover{border-color:var(--pink);color:var(--pink)}
  .addex{width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:11px;padding:12px;font-size:13.5px;font-weight:600;margin-top:2px}
  .addex:hover{border-color:var(--pink);color:var(--pink)}

  .checklist .item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;transition:.13s}
  .checklist .item.on{border-color:var(--done);background:var(--done-wash)}
  .chk-ico{width:26px;height:26px;flex:0 0 auto;color:var(--pink);opacity:.85}
  .chk-ico svg{width:100%;height:100%;display:block}
  .checklist .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:0 0 auto;display:grid;place-items:center;color:transparent;font-size:13px}
  .checklist .item.on .box{background:var(--done);border-color:var(--done);color:#fff}
  .checklist .txt{font-size:14px;font-weight:500;flex:1}
  .checklist .txt small{display:block;color:var(--faint);font-weight:400;font-size:11.5px;margin-top:1px}

  .runform{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:15px}
  .runrow{display:flex;gap:10px;flex-wrap:wrap}
  .rf{flex:1;min-width:120px;margin-bottom:11px}
  .rf label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .rf .inp{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px}
  .rf .inp:focus-within{border-color:var(--pink)}
  .rf input,.rf textarea{width:100%;border:none;background:transparent;color:var(--text);font-size:15px;font-weight:600;padding:10px}
  .rf .inp .u{font-size:11px;color:var(--faint);padding-right:10px}
  .rf textarea{font-weight:400;font-size:13.5px;min-height:56px;resize:vertical}
  .pace{font-size:12px;color:var(--gold);margin-top:2px;font-weight:600}
  .prescribe{font-size:12.5px;color:var(--muted);background:var(--pink-wash);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;margin-bottom:13px;line-height:1.45}
  .prescribe b{color:var(--text)}

  .notesarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);font-size:14px;padding:13px;min-height:80px;resize:vertical;line-height:1.5}
  .notesarea:focus{outline:none;border-color:var(--pink)}
  .notesarea::placeholder{color:var(--faint)}

  .picker{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .pick{font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 11px;border-radius:999px;transition:.13s}
  .pick.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}

  .finish{margin-top:20px;width:100%;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;background:var(--pink);color:#fff;transition:.15s}
  .finish:hover{background:var(--pink-deep)}
  .finish.done{background:var(--done-wash);color:var(--done);border:1px solid var(--done)}
  .summary{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .summary h4{margin:0 0 10px;font-family:var(--disp);font-weight:600;font-size:18px}
  .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:11px;padding:11px}
  .stat .v{font-family:var(--disp);font-size:22px;font-weight:600;color:var(--pink)}
  .stat .k{font-size:11px;color:var(--faint);margin-top:2px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
  .card h3{margin:0 0 4px;font-family:var(--disp);font-weight:600;font-size:19px}
  .card .cd{color:var(--muted);font-size:13px;margin-bottom:12px;line-height:1.45}
  .maxrow{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;margin-bottom:9px}
  .maxrow label{font-size:13.5px;color:var(--text)}
  .maxrow .inp{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px}
  .maxrow .inp:focus-within{border-color:var(--pink)}
  .maxrow input{width:100%;border:none;background:transparent;color:var(--text);font-size:15px;font-weight:600;padding:9px;text-align:right}
  .maxrow .u{font-size:11px;color:var(--faint);padding-right:9px}
  .btn{border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:600;transition:.13s}
  .btn:hover{border-color:var(--pink);color:var(--pink)}
  .btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
  .btn.pink:hover{background:var(--pink-deep)}
  .btn.danger{border-color:var(--pink-deep);color:var(--pink-soft)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap}
  .cycle-status{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .cycle-status b{color:var(--text)}

  .bw-goal{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:14px;padding:14px;margin-bottom:14px}
  .bw-goal .now{font-family:var(--disp);font-size:26px;font-weight:600;line-height:1}
  .bw-goal .gl{font-size:12px;color:var(--muted);margin-top:3px}
  .goalrow{display:flex;justify-content:space-around;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 6px;margin-bottom:14px}
  .goalrow .v{font-family:var(--disp);font-weight:600;font-size:18px}
  .goalrow .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:3px}
  .addbw{display:flex;gap:8px;margin-bottom:16px}
  .addbw .inp{flex:1;display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:11px}
  .addbw input{width:100%;border:none;background:transparent;color:var(--text);font-size:16px;font-weight:600;padding:12px}
  .addbw .u{font-size:12px;color:var(--faint);padding-right:12px}
  .addbw button{border:none;background:var(--pink);color:#fff;font-weight:700;border-radius:11px;padding:0 18px;font-size:14px}
  .spark{width:100%;height:70px;margin-bottom:6px}
  .bw-list{max-height:150px;overflow-y:auto}
  .bw-item{display:flex;justify-content:space-between;padding:8px 2px;border-top:1px solid var(--line-soft);font-size:13px}
  .bw-item span{color:var(--faint)}
  .bw-item button{background:none;border:none;color:var(--faint);font-size:12px}
  .mini-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:14px 0 8px}
  .goal-edit{display:flex;gap:8px;align-items:center}
  .goal-edit input{width:90px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:9px;font-size:14px;font-weight:600;text-align:center}

  .hist-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft)}
  .hist-item:first-child{border-top:none}
  .hist-item .hd{width:52px;text-align:center;flex:0 0 auto}
  .hist-item .hd .dnum{font-family:var(--disp);font-size:16px;font-weight:600;line-height:1}
  .hist-item .hd .dmon{font-size:10px;color:var(--faint);text-transform:uppercase}
  .hist-item .ht{flex:1;min-width:0}
  .hist-item .ht .n{font-weight:600;font-size:14px}
  .hist-item .ht .s{font-size:12px;color:var(--faint)}
  .hist-item .note-ic{color:var(--pink-soft);font-size:13px;flex:0 0 auto}
  .empty{color:var(--faint);font-size:13.5px;text-align:center;padding:24px 10px;line-height:1.5}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .nav-inner{max-width:760px;margin:0 auto;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .nav button{flex:1;background:none;border:none;color:var(--faint);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
  .nav button .ic{font-size:18px;line-height:1}
  .nav button.on{color:var(--pink)}

  .timerbar{position:fixed;left:0;right:0;bottom:64px;z-index:31;max-width:760px;margin:0 auto;background:var(--surface-2);border-top:1px solid var(--pink);padding:9px 16px;display:none;align-items:center;gap:12px}
  .timerbar.show{display:flex}
  .timerbar .tprog{position:absolute;left:0;top:0;height:2px;background:var(--pink);width:0;transition:width .2s linear}
  .timerbar .tl{font-family:var(--disp);font-weight:600;font-size:19px;min-width:52px}
  .timerbar .tlabel{font-size:12px;color:var(--muted);flex:1}
  .timerbar button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600}
  .timerbar button.skip{border-color:var(--pink);color:var(--pink)}

  .sheet-bg{position:fixed;inset:0;background:rgba(10,4,10,.55);backdrop-filter:blur(3px);z-index:70;display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:none;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto}
  .sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
  .sheet h3{font-family:var(--disp);font-weight:600;font-size:20px;margin:0 0 14px}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .fld input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:15px;font-weight:600;padding:11px}
  .fld input:focus{outline:none;border-color:var(--pink)}
  .stepper{display:flex;align-items:center;gap:14px}
  .stepper button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--pink);font-size:20px;font-weight:700}
  .stepper button:hover{border-color:var(--pink)}
  .stepper .val{font-family:var(--disp);font-size:24px;font-weight:600;min-width:40px;text-align:center}
  .kindrow{display:flex;gap:8px}
  .kindrow .pick{flex:1;text-align:center}
  .sheet-actions{display:flex;gap:8px;margin-top:10px}
  .sheet-actions .btn{flex:1;text-align:center}

  .view{display:none}
  .view.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view.on{animation:none}.fill,.chev,.chev-ex{transition:none}}
  .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:var(--pink);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .synk{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-14px);z-index:60;font-size:11.5px;font-weight:600;padding:6px 13px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);opacity:0;pointer-events:none;transition:.22s}
  .synk.show{opacity:1;transform:translateX(-50%)}
  .synk.ok{color:var(--done);border-color:var(--done)}
  .synk.warn{color:var(--warn);border-color:var(--warn)}
  .foot{color:var(--faint);font-size:11.5px;text-align:center;margin:26px 0 8px;line-height:1.5}

  /* ===================== LIQUID GLASS FUSION ===================== */
  :root{
    --glass:rgba(255,255,255,.10); --glass-2:rgba(255,255,255,.15);
    --glass-brd:rgba(255,255,255,.24);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.30), inset 0 0 0 .5px rgba(255,255,255,.10);
    --glass-sh:0 12px 32px -14px rgba(0,0,0,.65);
    --blur:blur(22px) saturate(165%); --blur-lite:blur(13px) saturate(150%);
  }
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
    --glass:rgba(255,255,255,.50); --glass-2:rgba(255,255,255,.64);
    --glass-brd:rgba(255,255,255,.72);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 .5px rgba(255,255,255,.45);
    --glass-sh:0 12px 30px -14px rgba(120,10,60,.30);
  }}
  :root[data-theme="light"]{
    --glass:rgba(255,255,255,.50); --glass-2:rgba(255,255,255,.64);
    --glass-brd:rgba(255,255,255,.72);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 .5px rgba(255,255,255,.45);
    --glass-sh:0 12px 30px -14px rgba(120,10,60,.30);
  }

  /* vibrant backdrop the glass refracts */
  body{background:
    radial-gradient(55% 40% at 12% 5%, rgba(255,61,127,.32), transparent 60%),
    radial-gradient(52% 36% at 92% 15%, rgba(255,150,120,.24), transparent 55%),
    radial-gradient(66% 52% at 50% 106%, rgba(180,90,255,.26), transparent 60%),
    var(--bg);}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) body{background:
    radial-gradient(55% 42% at 12% 5%, #ffd9ea, transparent 60%),
    radial-gradient(52% 36% at 92% 15%, #ffc9b3, transparent 55%),
    radial-gradient(66% 52% at 50% 106%, #ecc3ff, transparent 60%),
    linear-gradient(160deg,#ffe6f2,#ffd5e8 48%,#f6d0f2);}}
  :root[data-theme="light"] body{background:
    radial-gradient(55% 42% at 12% 5%, #ffd9ea, transparent 60%),
    radial-gradient(52% 36% at 92% 15%, #ffc9b3, transparent 55%),
    radial-gradient(66% 52% at 50% 106%, #ecc3ff, transparent 60%),
    linear-gradient(160deg,#ffe6f2,#ffd5e8 48%,#f6d0f2);}

  /* strong glass: primary cards */
  .hero,.card,.summary{
    background:var(--glass-2)!important;
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--glass-brd);box-shadow:var(--glass-sh),var(--glass-hi);position:relative}
  .hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,0) 30%)}
  .hero>*{position:relative;z-index:1}

  /* lighter glass: repeated / list surfaces */
  .ex,.sess,.pstrip,.runform,.checklist .item{
    background:var(--glass)!important;
    backdrop-filter:var(--blur-lite);-webkit-backdrop-filter:var(--blur-lite);
    border:1px solid var(--glass-brd);box-shadow:var(--glass-hi)}
  .weekbanner{
    background:linear-gradient(120deg, color-mix(in srgb,var(--pink) 22%,transparent), transparent)!important;
    backdrop-filter:var(--blur-lite);-webkit-backdrop-filter:var(--blur-lite);
    border:1px solid var(--glass-brd);box-shadow:var(--glass-hi)}
  .weekbanner.deload{background:linear-gradient(120deg, color-mix(in srgb,var(--gold) 26%,transparent), transparent)!important}

  /* small controls */
  .wk,.day-pill,.icon-btn,.chip,.pick,.btn{
    background:var(--glass)!important;
    backdrop-filter:var(--blur-lite);-webkit-backdrop-filter:var(--blur-lite);
    border:1px solid var(--glass-brd);box-shadow:var(--glass-hi)}
  /* selected / accent states keep a glossy pink */
  .wk.on,.day-pill.active,.pick.on{
    background:linear-gradient(160deg,var(--pink),var(--pink-deep))!important;
    border:1px solid rgba(255,255,255,.5)!important;
    box-shadow:0 8px 20px -7px rgba(199,30,91,.6),var(--glass-hi)!important}
  .wk.deload.on{background:linear-gradient(160deg,var(--gold),#c98a52)!important}
  .finish{background:linear-gradient(160deg,var(--pink),var(--pink-deep))!important;
    border:1px solid rgba(255,255,255,.4);box-shadow:0 14px 28px -12px rgba(199,30,91,.6),var(--glass-hi)}
  .finish.done{background:var(--done-wash)!important;border:1px solid var(--done);box-shadow:var(--glass-hi)}

  /* input fields → frosted */
  .set-row .field,.maxrow .inp,.rf .inp,.addbw .inp,.goal-edit input,.notesarea,.fld input,.pillfield{
    background:var(--glass)!important;border:1px solid var(--glass-brd)!important;
    backdrop-filter:var(--blur-lite);-webkit-backdrop-filter:var(--blur-lite)}

  /* floating glass tab bar */
  .nav{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-top:none!important}
  .nav-inner{margin:0 14px 12px;border-radius:30px;padding:9px 8px calc(9px + env(safe-area-inset-bottom));
    background:var(--glass-2);backdrop-filter:blur(28px) saturate(200%);-webkit-backdrop-filter:blur(28px) saturate(200%);
    border:1px solid var(--glass-brd);box-shadow:var(--glass-sh),var(--glass-hi)}
  .nav button.on .ic{filter:drop-shadow(0 2px 6px rgba(255,61,127,.55))}

  /* floating glass rest-timer, above the tab bar */
  .timerbar{left:14px;right:14px;bottom:92px;border-radius:20px;border:1px solid var(--glass-brd)!important;
    border-top:1px solid var(--glass-brd)!important;
    background:var(--glass-2)!important;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--glass-sh),var(--glass-hi)}
  .timerbar .tprog{border-radius:20px 20px 0 0}

  /* sheet + sync chip */
  .sheet{background:var(--glass-2)!important;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-brd)}
  .synk{backdrop-filter:var(--blur-lite);-webkit-backdrop-filter:var(--blur-lite);background:var(--glass-2)!important;border:1px solid var(--glass-brd)}
  @media (prefers-reduced-motion:reduce){*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}}
</style>
</head>

<script>
"use strict";

/* ================= ICONS ================= */
const AC="var(--pink-soft)";
const ICONS={

function svg(inner){return `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;}
function iconFor(name){
  const n=name.toLowerCase();let k='generic';
  if(n.includes('box jump')||n.includes('jump'))k='jump';
  else if(n.includes('slam'))k='slam';
  else if(n.includes('swing'))k='swing';
  else if(n.includes('push press')||n.includes('z press')||n.includes('overhead')||n.includes('shoulder press'))k='ohp';
  else if(n.includes('push-up')||n.includes('push up'))k='pushup';
  else if(n.includes('hamstring curl')||n.includes('leg curl'))k='legcurl';
  else if(n.includes('leg extension'))k='legext';
  else if(n.includes('abduct'))k='abductor';
  else if(n.includes('face pull'))k='facepull';
  else if(n.includes('pulldown')||n.includes('pull-up')||n.includes('pull up')||n.includes('chin'))k='pullup';
  else if(n.includes('split squat')||n.includes('lunge')||n.includes('step-down')||n.includes('step down')||n.includes('cossack'))k='lunge';
  else if(n.includes('hack')||n.includes('squat'))k='squat';
  else if(n.includes('thrust')||n.includes('bridge'))k='hipthrust';

// Same Firebase database Iron Ledger uses. Stored under the iron-ledger/users node
// (the node Iron Ledger's security rules already permit), on its own distinct key so
// it can't collide with Iron Ledger's own data.
const KEY="ruby-ledger-v1";
const SYNC_URL="https://iron-ledger-f988e-default-rtdb.firebaseio.com";

function defaults(){return {unit:"kg",theme:null,week:1,day:"Sun",cycle:1,prev:null,
  logs:{},checks:{},cores:{},runs:{},done:{},maxes:{},notes:{},custom:{},bw:[],bwGoal:null,updatedAt:0};}
let S=defaults(), saveMode=null, saveT=null, chipT=null;

function stor(){try{return (window.storage&&typeof window.storage.set==="function")?window.storage:null;}catch(e){return null;}}
function localOK(){try{localStorage.setItem("__rl_t","1");localStorage.removeItem("__rl_t");return true;}catch(e){return false;}}

function mergeRows(a,b){const len=Math.max(a?a.length:0,b?b.length:0),out=[];
  const sc=r=>((r&&r.done)?2:0)+((r&&r.w!=null)?1:0)+((r&&r.r!=null)?1:0);
  for(let i=0;i<len;i++){const x=a&&a[i],y=b&&b[i];if(!x){out[i]=y;continue;}if(!y){out[i]=x;continue;}out[i]=sc(y)>sc(x)?y:x;}return out;}
function mergeLogs(a,b){const out={};new Set([...Object.keys(a||{}),...Object.keys(b||{})]).forEach(k=>{const x=a&&a[k],y=b&&b[k];if(!x){out[k]=y;return;}if(!y){out[k]=x;return;}out[k]=mergeRows(x,y);});return out;}
function runScore(r){if(!r)return -1;return (r.dist?1:0)+(r.time?1:0)+(r.reps?1:0)+(r.note?1:0);}
function mergeNotes(l,r,newer){const out={};new Set([...Object.keys(l||{}),...Object.keys(r||{})]).forEach(k=>{const a=(l&&l[k])||"",b=(r&&r[k])||"";out[k]=(newer.notes&&newer.notes[k]!=null)?newer.notes[k]:(a.length>=b.length?a:b);});return out;}
function mergeState(l,r){
  if(!r)return l; if(!l)return r;
  const newer=(r.updatedAt||0)>(l.updatedAt||0)?r:l;
  const m=defaults();
  m.updatedAt=Math.max(l.updatedAt||0,r.updatedAt||0);
  m.unit=newer.unit||l.unit||"kg";
  m.theme=newer.theme!==undefined?newer.theme:l.theme;
  m.week=newer.week||l.week||1; m.day=newer.day||l.day||"Sun";
  m.bwGoal=newer.bwGoal!=null?newer.bwGoal:(l.bwGoal!=null?l.bwGoal:r.bwGoal);
  const wm={};(r.bw||[]).forEach(w=>wm[w.d]=w);(l.bw||[]).forEach(w=>{if(!wm[w.d]||newer===l)wm[w.d]=w;});
  m.bw=Object.values(wm).sort((a,b)=>a.d.localeCompare(b.d));
  const mk={};new Set([...Object.keys(l.maxes||{}),...Object.keys(r.maxes||{})]).forEach(k=>{const nv=newer.maxes&&newer.maxes[k];mk[k]=nv!=null?nv:((l.maxes&&l.maxes[k]!=null)?l.maxes[k]:(r.maxes&&r.maxes[k]));});m.maxes=mk;
  // custom program edits: newer copy wins per day
  m.custom={};new Set([...Object.keys(l.custom||{}),...Object.keys(r.custom||{})]).forEach(k=>{m.custom[k]=(newer.custom&&newer.custom[k])||(l.custom&&l.custom[k])||(r.custom&&r.custom[k]);});
  const lc=l.cycle||1,rc=r.cycle||1;
  if(lc!==rc){const hi=lc>rc?l:r;m.cycle=hi.cycle;m.prev=hi.prev||null;m.logs=Object.assign({},hi.logs);m.checks=Object.assign({},hi.checks);m.cores=Object.assign({},hi.cores);m.runs=Object.assign({},hi.runs);m.done=Object.assign({},hi.done);m.notes=Object.assign({},hi.notes);}
  else{
    m.cycle=lc;m.prev=newer.prev||l.prev||r.prev||null;
    m.logs=mergeLogs(l.logs,r.logs);
    m.checks={};new Set([...Object.keys(l.checks||{}),...Object.keys(r.checks||{})]).forEach(k=>{m.checks[k]=!!((l.checks&&l.checks[k])||(r.checks&&r.checks[k]));});
    m.done=Object.assign({},l.done,r.done,newer.done);
    m.cores=Object.assign({},l.cores,r.cores,newer.cores);
    m.notes=mergeNotes(l.notes,r.notes,newer);
    m.runs=Object.assign({},l.runs,r.runs);
    new Set([...Object.keys(l.runs||{}),...Object.keys(r.runs||{})]).forEach(k=>{const a=l.runs&&l.runs[k],b=r.runs&&r.runs[k];m.runs[k]=runScore(b)>runScore(a)?b:(a||b);});
  }
  return m;
}
async function cloudPull(){try{const r=await fetch(CLOUD+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)return false;const rem=await r.json();if(rem){S=mergeState(S,rem);return true;}}catch(e){}return false;}
async function cloudPush(){try{const r=await fetch(CLOUD,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)});return r.ok;}catch(e){return false;}}
async function writeLocal(payload){const s=stor();
  if(saveMode!=="local"&&s){try{await s.set(KEY,payload);if(localOK()){try{localStorage.setItem(KEY,payload);}catch(e){}}return "claude";}catch(e){}}
  if(localOK()){try{localStorage.setItem(KEY,payload);saveMode="local";return "local";}catch(e){}}return null;}
function setChip(k){const c=document.getElementById("chip");if(!c)return;clearTimeout(chipT);c.className="synk show";
  if(k==="saving")c.textContent="Saving…";
  else if(k==="synced"){c.textContent="Synced to cloud ✓";c.classList.add("ok");chipT=setTimeout(()=>c.classList.remove("show"),1500);}
  else if(k==="device"){c.textContent="Saved on device ✓";c.classList.add("ok");chipT=setTimeout(()=>c.classList.remove("show"),1500);}
  else if(k==="failed"){c.textContent="Save failed — will retry";c.classList.add("warn");}}
async function writeState(){S.updatedAt=Date.now();const p=JSON.stringify(S);const lr=await writeLocal(p);const cl=await cloudPush();
  if(cl){setChip("synced");return;}if(lr){setChip("device");return;}setChip("failed");saveT=setTimeout(writeState,2500);}
function save(){clearTimeout(saveT);setChip("saving");saveT=setTimeout(writeState,350);}

async function boot(){

  let metaChips="";
  if(p.type==="lift")metaChips=`<div class="meta"><span class="chip"><b>${effectiveEx(day).length}</b> exercises</span><span class="chip">Week <b>${S.week}</b> · ${W.label}</span>${S.cycle>1?`<span class="chip">Cycle <b>${S.cycle}</b></span>`:''}</div>`;
  hero.innerHTML=`<div class="eyebrow">${p.eyebrow}</div><h2>${esc(p.title)}</h2><div class="focus">${p.focus}</div>${metaChips}`;
  root.appendChild(hero);

  root.appendChild(progressBar(day));
  root.appendChild(proteinStrip());

  const wb=el("div","weekbanner"+(W.deload?" deload":""));
  wb.innerHTML=`<div class="wl">Week ${S.week} · ${W.label}${p.type==="lift"?" · "+W.rpe:""}</div><div class="wc">${esc(p.type==="lift"?W.cue:(p.prog||W.cue))}</div>`;
  root.appendChild(wb);

  if(p.warmup)root.appendChild(checklistBlock("Warm-Up · Mobility",p.warmup,day,"wu"));

  if(p.type==="lift")renderLift(root,p,day);
  else if(p.type==="mobility")renderMobility(root,p,day);
  else if(p.type==="run")renderRun(root,p,day);
  else if(p.type==="sprint")renderSprint(root,p,day);

  if(p.finish)root.appendChild(checklistBlock("Cool-Down · Stretch",p.finish,day,"fn"));

  root.appendChild(notesBlock(day));

  const done=dayDone(day);
  const fin=el("button","finish"+(done?" done":""));
  fin.textContent=done?"✓ Session complete — tap to reopen":"Finish session";
  fin.onclick=()=>{if(done)delete S.done[doneKey(day)];else S.done[doneKey(day)]=new Date().toISOString();save();renderWeek();renderTrain();if(!done)toast("Logged. Strong work.");};
  root.appendChild(fin);

  if(done&&p.type==="lift")root.appendChild(sessionSummary(day));
  root.appendChild(el("div","foot","Tap a section header to collapse it · rest timer beeps when time's up · data syncs to the cloud."));
}

function runHasData(r){return !!(r&&(r.dist||r.time||r.reps||r.note));}
// Full session-completion count for the day, whatever the day type.
function dayProgress(day){
  const p=PROGRAM[day];let total=0,done=0;
  const chk=grp=>arr=>arr.forEach((_,i)=>{total++;if(S.checks[chkKey(day,grp,i)])done++;});
  if(p.warmup)chk("wu")(p.warmup);
  if(p.type==="lift"){
    p.cns.forEach((cn,i)=>{
      if(cn.kind==="check"){total++;if(S.checks[chkKey(day,"cn",i)])done++;}
      else{const n=adjSets(cn.sets);total+=n;(S.logs[logKey(day,"cns"+i)]||[]).forEach(r=>{if(r&&r.done)done++;});}
    });
    effectiveEx(day).forEach(e=>{const n=setsCount(e);total+=n;(S.logs[logKey(day,e.id)]||[]).forEach(r=>{if(r&&r.done)done++;});});
  } else if(p.type==="mobility"){
    chk("mob")(p.mobility);chk("ath")(p.athletic);chk("up")(p.upper);
    total+=3;done+=Math.min(3,(S.cores[coreKey(day)]||[]).length);
  } else if(p.type==="sprint"){
    total+=1;if(runHasData(S.runs[runKey(day)]))done++;
    total+=3;done+=Math.min(3,(S.cores[coreKey(day)]||[]).length);
  } else if(p.type==="run"){
    total+=1;if(runHasData(S.runs[runKey(day)]))done++;
  }
  if(p.finish)chk("fn")(p.finish);
  done=Math.min(done,total);
  return {total,done,pct:total?Math.round(100*done/total):0};
}
function progressBar(day){
  const c=dayProgress(day);
  const w=el("div","sess");
  w.innerHTML=`<div class="bar"><div class="fill" style="width:${c.pct}%"></div></div><div class="lbl"><span>Session progress</span><span><b>${c.done}</b> / ${c.total} done · ${c.pct}%</span></div>`;
  return w;
}
// Protein target strip (Iron Ledger parity): 1 g per lb of bodyweight, from latest weigh-in.
function proteinStrip(){
  const data=[...S.bw].sort((a,b)=>a.d<b.d?-1:1);
  const latest=data.length?data[data.length-1].v:null;
  const grams=latest!=null?Math.round(S.unit==="lb"?latest:latest*2.2):null;
  const val=grams!=null?("~"+grams+" g"):"— g";
  const sub=grams!=null?"1 g per lb of bodyweight — updates with weigh-ins":"Log a weigh-in on the Weight tab to set this";
  const s=el("div","pstrip");
  s.innerHTML=`<div><div class="k">Protein today</div><div class="s">${sub}</div></div><div class="g">${val}</div>`;
  return s;
}

function checklistBlock(title,items,day,grp){
  const {b,body}=makeBlock(title,null,day);
  const cl=el("div","checklist");
  items.forEach((it,i)=>{
    const k=chkKey(day,grp,i);const on=!!S.checks[k];
    const row=el("div","item"+(on?" on":""));
    row.innerHTML=`<div class="chk-ico">${wuIconFor(it)}</div><div class="box">✓</div><div class="txt">${esc(it)}</div>`;
    row.onclick=()=>{const nv=!row.classList.contains("on");row.classList.toggle("on",nv);S.checks[k]=nv;save();root_refreshProgress(day);};
    cl.appendChild(row);
  });
  body.appendChild(cl);
  return b;
}

function notesBlock(day){
  const {b,body}=makeBlock("Notes",null,day);
  const ta=el("textarea","notesarea");
  ta.placeholder="How did today feel? Aches, PRs, energy, what to change next time…";
  ta.value=S.notes[noteKey(day)]||"";
  ta.onchange=()=>{const v=ta.value.trim();if(v)S.notes[noteKey(day)]=v;else delete S.notes[noteKey(day)];save();};
  body.appendChild(ta);
  return b;
}

function prefill(day,id){
  let within=null;
  if(S.week>1){within=S.logs["w"+(S.week-1)+"-"+day+"-"+id];}
  const cyc=S.prev&&S.prev.logs?S.prev.logs[logKey(day,id)]:null;
  return {within,cyc};
}

function exerciseCard(e,day){
  const nSets=setsCount(e);
  const card=el("div","ex"+(e.ss?" ss":"")+(e.custom?" custom":""));
  const stored=S.logs[logKey(day,e.id)]||[];
  let doneCount=0;stored.forEach(s=>{if(s&&s.done)doneCount++;});
  doneCount=Math.min(doneCount,nSets);
  const key=day+":"+e.id;
  const defOpen=doneCount<nSets;
  const open=exToggle.has(key)?exToggle.get(key):defOpen;

  const tload=e.t1?targetLoad(e):null;
  const loadHtml=e.t1?(tload?`<div class="load">≈ ${tload}${S.unit}</div>`:`<div class="load set1rm">set 1RM ↗</div>`):"";
  const statusHtml=`<div class="ex-status${doneCount>=nSets&&nSets>0?" full":""}">${doneCount>=nSets&&nSets>0?"✓ done":doneCount+" / "+nSets}</div>`;

  const head=el("div","ex-head");
  head.innerHTML=`<div class="ex-ico">${iconFor(e.name)}</div>
    <div class="ex-main">${e.t1?`<div class="tag">Main lift · ${wk().rpe}</div>`:""}<div class="ex-name">${esc(e.name)}${e.ss?'<span class="ss-tag">SS '+e.ss+'</span>':''}</div><div class="ex-rx">${nSets} × ${esc(e.reps)}</div></div>
    <div class="ex-right">${loadHtml}<div class="row2">${statusHtml}<button class="edit-btn" title="Edit">✎</button><span class="chev-ex${open?"":" closed"}">⌄</span></div></div>`;
  head.querySelector(".edit-btn").onclick=(ev)=>{ev.stopPropagation();openEditSheet(day,e.id);};
  head.onclick=()=>{exToggle.set(key,!open);renderTrain();};
  card.appendChild(head);

  const bodyWrap=el("div","ex-body");if(!open)bodyWrap.style.display="none";
  if(e.note)bodyWrap.appendChild(el("div","ex-note",esc(e.note)));

  const est=el("div","est");
  const sets=el("div","sets");
  const pf=prefill(day,e.id),unit=S.unit,rest=restFor(e);
  for(let i=0;i<nSets;i++){
    const row=el("div","set-row");
    const cur=stored[i]||{};
    const wIn=pf.within&&pf.within[i],cIn=pf.cyc&&pf.cyc[i];
    row.appendChild(el("div","set-n","#"+(i+1)));
    if(wIn&&(wIn.w!=null||wIn.r!=null))row.appendChild(el("div","last",`last wk · <b>${wIn.w??'—'}${wIn.w!=null?unit:''} × ${wIn.r??'—'}</b>`));
    else if(cIn&&(cIn.w!=null||cIn.r!=null))row.appendChild(el("div","last",`last cycle · <b>${cIn.w??'—'}${cIn.w!=null?unit:''} × ${cIn.r??'—'}</b>`));
    const preW=cur.w!=null?cur.w:(wIn&&wIn.w!=null?wIn.w:(cIn&&cIn.w!=null?cIn.w:""));
    const preR=cur.r!=null?cur.r:(wIn&&wIn.r!=null?wIn.r:(cIn&&cIn.r!=null?cIn.r:""));
    const wf=el("div","field");wf.innerHTML=`<input type="number" inputmode="decimal" step="0.5" placeholder="${e.kind==='load-opt'?'BW':'0'}" value="${preW}"><span class="u">${e.kind==="load-opt"?"+"+unit:unit}</span>`;
    const rf=el("div","field");rf.innerHTML=`<input type="number" inputmode="numeric" placeholder="${esc(e.reps)}" value="${preR}"><span class="u">rep</span>`;
    const chk=el("button","check"+(cur.done?" on":""),"✓");
    const wi=wf.querySelector("input"),ri=rf.querySelector("input");
    function persist(){const arr=S.logs[logKey(day,e.id)]||[];arr[i]={w:wi.value===""?null:+wi.value,r:ri.value===""?null:+ri.value,done:chk.classList.contains("on")};S.logs[logKey(day,e.id)]=arr;save();updateEst();refreshStatus();}
    wi.onchange=persist;ri.onchange=persist;
    chk.onclick=()=>{const turningOn=!chk.classList.contains("on");chk.classList.toggle("on");if(turningOn){if(ri.value===""){const m=String(e.reps).match(/\d+/);if(m)ri.value=m[0];}if(wi.value===""&&preW!=="")wi.value=preW;persist();startTimer(rest);}else persist();};
    row.appendChild(wf);row.appendChild(rf);row.appendChild(chk);
    sets.appendChild(row);
  }
  bodyWrap.appendChild(sets);
  const rr=el("div","rest-btn-row");const rb=el("button","mini-btn","Rest "+fmtClock(rest));rb.onclick=()=>startTimer(rest);rr.appendChild(rb);bodyWrap.appendChild(rr);
  bodyWrap.appendChild(est);
  card.appendChild(bodyWrap);

  function refreshStatus(){let d=0;(S.logs[logKey(day,e.id)]||[]).forEach(s=>{if(s&&s.done)d++;});d=Math.min(d,nSets);const st=head.querySelector(".ex-status");st.textContent=(d>=nSets&&nSets>0)?"✓ done":d+" / "+nSets;st.classList.toggle("full",d>=nSets&&nSets>0);const bar=$("#view-train .sess .fill");if(bar)root_refreshProgress(day);}
  function updateEst(){if(!e.t1){est.textContent="";return;}let best=0;(S.logs[logKey(day,e.id)]||[]).forEach(s=>{if(s){const v=epley(s.w,s.r);if(v>best)best=v;}});est.textContent=best?`Est. 1RM ≈ ${Math.round(best)}${unit}`:"";}
  updateEst();
  return card;
}
function root_refreshProgress(day){const old=$("#view-train .sess");if(!old)return;const nw=progressBar(day);old.replaceWith(nw);}
function restFor(e){if(e.rest)return e.rest;if(e.t1)return 150;if(e.kind==="load-opt")return 120;return 75;}

function renderLift(root,p,day){
  // CNS
  const {b:cb,body:cbody}=makeBlock("CNS Prep","Rest 60–90s · stay fresh",day,true);
  p.cns.forEach((cn,i)=>{
    if(cn.kind==="check"){
      const card=el("div","ex");
      const k=chkKey(day,"cn",i);const on=!!S.checks[k];
      card.innerHTML=`<div class="ex-head" style="cursor:default"><div class="ex-ico">${iconFor(cn.name)}</div><div class="ex-main"><div class="ex-name">${esc(cn.name)}</div><div class="ex-rx">${adjSets(cn.sets)} × ${cn.reps}</div>${cn.note?'<div class="ex-note">'+esc(cn.note)+'</div>':''}</div><div class="ex-right"><button class="check${on?" on":""}">✓</button></div></div>`;
      card.querySelector(".check").onclick=function(){this.classList.toggle("on");S.checks[k]=this.classList.contains("on");save();root_refreshProgress(day);};
      cbody.appendChild(card);
    } else {
      const e=Object.assign({},cn,{id:"cns"+i});

}

  const build=(title,arr,grp,subDefault)=>{

function corePicker(day,label){
  const {b,body}=makeBlock(label,null,day);
  const count=el("div","mini-label");count.style.margin="0 2px 8px";
  const pick=el("div","picker");

function renderRun(root,p,day){
  const box=el("div","block");box.innerHTML=`<div class="prescribe">${p.prescribe}</div>`;
  const form=el("div","runform");const r=S.runs[runKey(day)]||{};const du=S.unit==="kg"?"km":"mi";

  const persist=()=>{S.runs[runKey(day)]={dist:d.value===""?null:+d.value,time:t.value===""?null:+t.value,note:n.value};save();calc();root_refreshProgress(day);};
  d.onchange=persist;t.onchange=persist;n.onchange=persist;calc();

function renderSprint(root,p,day){
  const box=el("div","block");box.innerHTML=`<div class="prescribe">${p.prescribe}</div>`;
  const form=el("div","runform");const r=S.runs[runKey(day)]||{};

  box.appendChild(form);root.appendChild(box);
  const reps=$("#sReps",form),d=$("#sDist",form),n=$("#sNote",form);
  const persist=()=>{S.runs[runKey(day)]={reps:reps.value===""?null:+reps.value,dist:d.value,note:n.value};save();root_refreshProgress(day);};
  reps.onchange=persist;d.onchange=persist;n.onchange=persist;

}

function sessionSummary(day){
  const unit=S.unit;let ton=0,setsDone=0,bestLift=null,bestVal=0;
  effectiveEx(day).forEach(e=>{(S.logs[logKey(day,e.id)]||[]).forEach(s=>{if(s&&s.w&&s.r)ton+=s.w*s.r;if(s&&s.done)setsDone++;if(e.t1&&s){const v=epley(s.w,s.r);if(v>bestVal){bestVal=Math.round(v);bestLift=e.name;}}});});
  const box=el("div","summary");
  box.innerHTML=`<h4>Session summary</h4><div class="statgrid"><div class="stat"><div class="v">${setsDone}</div><div class="k">sets completed</div></div><div class="stat"><div class="v">${Math.round(ton).toLocaleString()}</div><div class="k">total ${unit} lifted</div></div><div class="stat"><div class="v">${bestVal||'—'}</div><div class="k">${bestLift?'best 1RM ('+bestLift.split(' ')[0]+')':'top lift'}</div></div></div>`;
  return box;
}

function openSheet(html){$("#sheetBody").innerHTML=html;$("#sheetBg").classList.add("open");}
function closeSheet(){$("#sheetBg").classList.remove("open");}
$("#sheetBg").onclick=(e)=>{if(e.target===$("#sheetBg"))closeSheet();};

function openEditSheet(day,id){
  const e=effectiveEx(day).find(x=>x.id===id);if(!e)return;
  const c=customFor(day);
  let sets=setsCount(e);
  openSheet(`
    <h3>Edit exercise</h3>
    <div class="fld"><label>Name</label><input id="edName" value="${esc(e.name)}"></div>
    <div class="fld"><label>Reps / scheme</label><input id="edReps" value="${esc(e.reps)}"></div>
    <div class="fld"><label>Sets</label><div class="stepper"><button id="edMinus">−</button><div class="val" id="edSets">${sets}</div><button id="edPlus">+</button></div></div>
    <div class="sheet-actions"><button class="btn" id="edCancel">Cancel</button><button class="btn danger" id="edRemove">Remove</button><button class="btn pink" id="edSave">Save</button></div>
    ${e.base?'<div class="cd" style="margin:12px 0 0;text-align:center"><button class="mini-btn" id="edReset">Reset to program default</button></div>':''}
  `);
  $("#edMinus").onclick=()=>{if(sets>1)sets--;$("#edSets").textContent=sets;};
  $("#edPlus").onclick=()=>{if(sets<12)sets++;$("#edSets").textContent=sets;};
  $("#edCancel").onclick=closeSheet;
  $("#edSave").onclick=()=>{
    const name=$("#edName").value.trim(),reps=$("#edReps").value.trim();
    if(e.base){c.ov[e.id]=c.ov[e.id]||{};const ov=c.ov[e.id];
      const orig=PROGRAM[day].ex[+e.id];
      if(name&&name!==orig.name)ov.name=name;else delete ov.name;
      if(reps&&reps!==orig.reps)ov.reps=reps;else delete ov.reps;
      ov.sets=sets;
      if(!ov.name&&!ov.reps&&ov.sets===orig.sets&&!ov.removed)delete c.ov[e.id];
    } else {
      const a=c.add.find(x=>x.id===e.id);if(a){a.name=name||a.name;a.reps=reps||a.reps;a.sets=sets;}
    }
    save();closeSheet();renderTrain();toast("Exercise updated");
  };
  $("#edRemove").onclick=()=>{
    if(e.base){c.ov[e.id]=c.ov[e.id]||{};c.ov[e.id].removed=true;}
    else c.add=c.add.filter(x=>x.id!==e.id);
    save();closeSheet();renderTrain();toast("Exercise removed");
  };
  if($("#edReset"))$("#edReset").onclick=()=>{delete c.ov[e.id];save();closeSheet();renderTrain();toast("Reset to default");};
}

/* ================= REST TIMER ================= */
let tEnd=null,tInt=null,tTotal=0,audioCtx=null;
function fmtClock(s){return Math.floor(s/60)+":"+String(Math.max(0,s)%60).padStart(2,"0");}
function beep(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.setValueAtTime(0.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.32,audioCtx.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.45);o.start();o.stop(audioCtx.currentTime+0.47);}catch(e){}}
function startTimer(sec){tTotal=sec;tEnd=Date.now()+sec*1000;$("#timerbar").classList.add("show");clearInterval(tInt);tInt=setInterval(tick,200);tick();}
function tick(){const left=Math.max(0,Math.round((tEnd-Date.now())/1000));$("#tLeft").textContent=fmtClock(left);$("#tFill").style.width=(tTotal?(1-left/tTotal)*100:100)+"%";if(left<=0){clearInterval(tInt);beep();setTimeout(()=>$("#timerbar").classList.remove("show"),700);}}
$("#tSkip").onclick=()=>{clearInterval(tInt);$("#timerbar").classList.remove("show");};
$("#tPlus").onclick=()=>{tEnd+=30000;tTotal+=30;tick();};

/* ================= BODYWEIGHT ================= */
function dateKey(d=new Date()){return d.toISOString().slice(0,10);}
function fmtDate(d){return new Date(d+"T00:00:00").toLocaleDateString('en',{month:'short',day:'numeric'});}
function renderWeightView(){
  const host=$("#bwPanel");host.innerHTML="";const unit=S.unit;
  const data=[...S.bw].sort((a,b)=>a.d<b.d?-1:1);const latest=data.length?data[data.length-1].v:null;const first=data.length?data[0].v:null;const goal=S.bwGoal;
  const g=el("div","bw-goal");let ring="";
  if(goal&&latest&&data.length){const total=Math.abs(goal-first)||1;const prog=Math.min(1,Math.abs(latest-first)/total);const R=26,C=2*Math.PI*R,off=C*(1-prog);
    ring=`<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--pink)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="var(--pink)" font-family="Inter">${Math.round(prog*100)}%</text></svg>`;
  } else ring=`<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--line)" stroke-width="7"/></svg>`;
  g.innerHTML=`${ring}<div><div class="now">${latest!=null?latest+' '+unit:'—'}</div><div class="gl">${goal?('goal '+goal+' '+unit):'set a goal below'}</div></div>`;
  host.appendChild(g);
  // start / change / to-go
  if(data.length){
    const change=(latest-first);const toGo=goal!=null?(goal-latest):null;
    const gr=el("div","goalrow");
    gr.innerHTML=`<div><div class="v">${first}</div><div class="k">start</div></div>
      <div><div class="v" style="color:${change===0?'var(--muted)':(change>0?'var(--done)':'var(--pink)')}">${change>0?'+':''}${(+change.toFixed(1))}</div><div class="k">change</div></div>
      <div><div class="v">${toGo!=null?(toGo>0?'+':'')+(+toGo.toFixed(1)):'—'}</div><div class="k">${goal!=null?'to goal':'no goal'}</div></div>`;
    host.appendChild(gr);
  }
  const add=el("div","addbw");add.innerHTML=`<div class="inp"><input id="bwIn" type="number" inputmode="decimal" step="0.1" placeholder="Today's weight"><span class="u">${unit}</span></div><button id="bwAdd">Log</button>`;host.appendChild(add);
  $("#bwAdd",add).onclick=()=>{const v=+$("#bwIn",add).value;if(!v){toast("Enter a number");return;}const d=dateKey();const ex=S.bw.find(x=>x.d===d);if(ex)ex.v=v;else S.bw.push({d,v});save();renderWeightView();toast("Weight logged");};
  if(data.length>=2){const s=el("div");s.appendChild(sparkline(data));host.appendChild(s);}
  host.appendChild(el("div","mini-label","Goal"));
  const ge=el("div","goal-edit");ge.innerHTML=`<input id="goalIn" type="number" inputmode="decimal" step="0.1" placeholder="${unit}" value="${goal??''}"><button class="btn" id="goalSave">Save goal</button>`;host.appendChild(ge);
  $("#goalSave",ge).onclick=()=>{const v=$("#goalIn",ge).value;S.bwGoal=v===""?null:+v;save();renderWeightView();toast("Goal updated");};
  if(data.length){host.appendChild(el("div","mini-label","Recent entries"));const list=el("div","bw-list");
    [...data].reverse().slice(0,30).forEach(x=>{const row=el("div","bw-item");row.innerHTML=`<span>${fmtDate(x.d)}</span><b>${x.v} ${unit}</b>`;const del=el("button",null,"remove");del.onclick=()=>{S.bw=S.bw.filter(y=>y.d!==x.d);save();renderWeightView();};row.appendChild(del);list.appendChild(row);});
    host.appendChild(list);}
  else host.appendChild(el("div","empty","No entries yet. Log your weight to start the trend."));
}
function sparkline(data){const w=520,h=70,pad=6;const vals=data.map(d=>d.v),min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1,n=data.length;
  const pts=data.map((d,i)=>[pad+(i/(n-1))*(w-2*pad),h-pad-((d.v-min)/rng)*(h-2*pad)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L ${pts[n-1][0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z`;
  const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("class","spark");s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("preserveAspectRatio","none");
  s.innerHTML=`<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pink)" stop-opacity="0.28"/><stop offset="1" stop-color="var(--pink)" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#sg)"/><path d="${path}" fill="none" stroke="var(--pink)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[n-1][0].toFixed(1)}" cy="${pts[n-1][1].toFixed(1)}" r="3.4" fill="var(--pink)"/>`;
  return s;
}

/* ================= HISTORY ================= */
function renderHistory(){
  const host=$("#histPanel");host.innerHTML="";
  const done=Object.entries(S.done).sort((a,b)=>String(a[1])<String(b[1])?1:-1);
  if(!done.length){host.appendChild(el("div","empty","No finished sessions in this cycle yet.<br>Complete a workout and it'll show up here."));host.appendChild(backupHint());return;}
  const card=el("div","card");card.style.padding="6px 16px";
  done.forEach(([k,ts])=>{
    const m=k.match(/^w(\d+)-(\w+)$/);if(!m)return;const wnum=m[1],day=m[2];const p=PROGRAM[day];if(!p)return;
    const dt=new Date(ts);const hasNote=!!S.notes["w"+wnum+"-"+day];
    const row=el("div","hist-item");
    row.innerHTML=`<div class="hd"><div class="dnum">W${wnum}</div><div class="dmon">${dt.toLocaleString('en',{month:'short',day:'numeric'})}</div></div><div class="ht"><div class="n">${esc(p.title)}</div><div class="s">${p.eyebrow} · ${WEEKS[wnum-1]?WEEKS[wnum-1].label:''}</div></div>${hasNote?'<div class="note-ic" title="Has notes">✎</div>':''}`;
    card.appendChild(row);
  });
  host.appendChild(card);
}
function backupHint(){const d=el("div","foot","Tip: back up your data from the Setup tab.");return d;}

/* ================= SETUP ================= */
function bestEstFor(maxKey){let best=0;for(const day of ORDER){const p=PROGRAM[day];if(p.type!=="lift")continue;p.ex.forEach((ex,i)=>{if(ex.max!==maxKey)return;for(let w=1;w<=6;w++){const rows=S.logs["w"+w+"-"+day+"-"+i]||[];rows.forEach(s=>{if(s){const v=epley(s.w,s.r);if(v>best)best=v;}});}});}return best?Math.round(best):0;}
function renderSetup(){
  const host=$("#setupPanel");host.innerHTML="";
  const cyc=el("div","card");
  const prevTxt=S.prev?`Cycle ${S.prev.cycle} archived ${S.prev.archivedOn}. Its numbers show as “last cycle” on every lift.`:`Finish all 6 weeks, retest your maxes, then start a fresh cycle here.`;
  cyc.innerHTML=`<h3>Your cycle</h3><div class="cycle-status">Currently on <b>Cycle ${S.cycle||1}</b>, <b>Week ${S.week}</b> (${wk().label}).<br>${prevTxt}</div><div class="btnrow"><button class="btn danger" id="cycleBtn">Start new cycle</button></div>`;
  host.appendChild(cyc);
  let armed=false;
  $("#cycleBtn",cyc).onclick=function(){if(!armed){armed=true;this.textContent="Tap again to confirm";setTimeout(()=>{armed=false;const b=$("#cycleBtn");if(b)b.textContent="Start new cycle";},4000);return;}
    S.prev={cycle:S.cycle||1,logs:S.logs,archivedOn:dateKey()};S.cycle=(S.cycle||1)+1;S.logs={};S.checks={};S.cores={};S.runs={};S.done={};S.notes={};S.week=1;save();toast("New cycle started — week 1");renderAll();};

  const mx=el("div","card");
  mx.innerHTML=`<h3>Training maxes (1RM)</h3><div class="cd">Optional. Enter a 1-rep max and each main lift shows a target working weight that scales with the week. Leave blank to just train by feel.</div>`;
  MAX_LIFTS.forEach(l=>{
    const rowEl=el("div","maxrow");
    rowEl.innerHTML=`<label>${esc(l.n)}</label><div class="inp"><input type="number" inputmode="decimal" step="0.5" placeholder="${bestEstFor(l.k)||''}" value="${S.maxes[l.k]??''}"><span class="u">${S.unit}</span></div>`;
    const inp=rowEl.querySelector("input");
    inp.onchange=()=>{if(inp.value===""){delete S.maxes[l.k];}else S.maxes[l.k]=+inp.value;save();};
    mx.appendChild(rowEl);
  });
  const fillBtn=el("button","btn","Fill blanks from my best logged sets");fillBtn.style.marginTop="6px";
  fillBtn.onclick=()=>{let n=0;MAX_LIFTS.forEach(l=>{if(S.maxes[l.k]==null){const e=bestEstFor(l.k);if(e){S.maxes[l.k]=e;n++;}}});save();renderSetup();toast(n?`Filled ${n} from your logs`:"No logged sets yet to estimate from");};
  mx.appendChild(fillBtn);host.appendChild(mx);

  // customizations reset
  const cust=el("div","card");
  const edited=ORDER.filter(d=>hasCustom(d));
  cust.innerHTML=`<h3>Program edits</h3><div class="cd">${edited.length?`You've customised: <b>${edited.map(d=>PROGRAM[d].title).join(", ")}</b>. Edits apply to every week and cycle.`:`No custom edits yet. On any workout, tap ✎ on an exercise to rename it, change sets, or remove it — or “＋ Add exercise”.`}</div>`;
  if(edited.length){const br=el("div","btnrow");edited.forEach(d=>{const b=el("button","btn","Reset "+PROGRAM[d].title);b.onclick=()=>{delete S.custom[d];save();renderSetup();renderTrain();toast(PROGRAM[d].title+" reset");};br.appendChild(b);});cust.appendChild(br);}
  host.appendChild(cust);

  const bk=el("div","card");
  bk.innerHTML=`<h3>Backup</h3><div class="cd">Your data lives in the cloud and on this device. This is an extra copy you control.</div>`;
  const brow=el("div","btnrow");
  const exp=el("button","btn","Export backup");const imp=el("button","btn","Restore backup");
  exp.onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ruby-ledger-"+dateKey()+".json";a.click();toast("Backup downloaded");};
  imp.onclick=()=>{const inp=document.createElement("input");inp.type="file";inp.accept="application/json";inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const data=JSON.parse(rd.result);S=mergeState(S,data);save();renderAll();toast("Backup restored & merged");}catch(err){toast("Couldn't read that file");}};rd.readAsText(f);};inp.click();};
  brow.appendChild(exp);brow.appendChild(imp);bk.appendChild(brow);host.appendChild(bk);

  const sn=el("div","card");
  sn.innerHTML=`<h3>Sync</h3><div class="cd" style="margin:0">Every change saves to this device and to a shared cloud database, so your log follows you across phones automatically — no codes, no backup steps. The chip up top confirms each save.</div>`;
  host.appendChild(sn);
}

/* ================= NAV / TOGGLES ================= */
document.querySelectorAll(".nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    const v=b.dataset.view;
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));$("#view-"+v).classList.add("on");
    const showStrips=v==="train";$("#weeks").style.display=showStrips?"flex":"none";$("#week").style.display=showStrips?"flex":"none";
    renderCurrent();window.scrollTo({top:0});
  };
});
const themeBtn=$("#themeBtn");
function applyTheme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme");}
themeBtn.onclick=()=>{const cur=S.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");S.theme=cur==="dark"?"light":"dark";save();applyTheme();};
const unitBtn=$("#unitBtn");
function applyUnit(){unitBtn.textContent=S.unit;}
unitBtn.onclick=()=>{S.unit=S.unit==="kg"?"lb":"kg";save();applyUnit();renderCurrent();};

/* ================= INIT ================= */
boot();
</script>
</body>
</html>
